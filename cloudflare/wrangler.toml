# 한글원샷 새 판 — 시험 주소(2026-10-31부터 시험 전용 D1·KV). 공개판 설정은 wrangler.prod.toml.
# Cloudflare Pages + Functions(서버) + D1(자료) + KV(올린 파일). public/은 deploy.py가 저장소 화면 파일로 채움.
# 로그인 코드 해시 열쇠는 비밀 CODE_PEPPER(pages secret, 두 프로젝트·.dev.vars 모두 같은 값 — 공개판 교사 코드로 시험 주소에도 로그인됨).
name = "humanssaem-hangeul-oneshot-v2"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "hangeul-oneshot-test"
database_id = "97aef17b-c186-4b75-bb85-879ba7618f13"

[[kv_namespaces]]
binding = "FILES"
id = "27e1b9a27e64427b98e31925d011048c"
