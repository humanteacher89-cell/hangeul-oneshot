  const fileExt = n => (String(n || '').match(/\.([a-z0-9]+)$/i) || ['', ''])[1].toLowerCase();

  const HTML_SHIM = '<script>(function(){function m(){var d={};return{getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[k]=String(v)},removeItem:function(k){delete d[k]},clear:function(){d={}},key:function(i){return Object.keys(d)[i]||null},get length(){return Object.keys(d).length}}}'
    + "['localStorage','sessionStorage'].forEach(function(n){try{if(window[n])return}catch(e){}try{Object.defineProperty(window,n,{value:m()})}catch(e){}});"

  // HTML 파일 고쳐 올리기: UTF-8로 맞추고(옛 EUC-KR 파일도) 임시 저장소를 맨 앞에 넣는다
  async function prepareHtml(fl) {
    const buf = await fl.arrayBuffer();
    let text; try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { text = new TextDecoder('euc-kr').decode(buf); }

  }

    const mats = (raw.materials || []).map(normMaterial).filter(m => m.pub && m.title && m.topic && m.level && m.url);
    const meta = {};
    (raw.topics || []).forEach((tp, i) => {
      const n = String(tp.topic || '').trim();
      if (n) meta[n] = { fr: String(tp.fr || '').trim(), group: String(tp.group || '').trim(), order: Number(tp.order) || (1000 + i), icon: String(tp.icon || '').trim(), qid: Number(tp.qid) || 0 };
    });
    // 주제 목록: 주제 탭 순서 → 자료에 처음 나온 순서. qid = 소주제 고정 번호(짧은 QR 주소 #/q/, 없으면 0)
    const seen = new Map();
    Object.keys(meta).forEach(n => seen.set(n, { name: n, fr: meta[n].fr, group: meta[n].group, order: meta[n].order, icon: meta[n].icon, qid: meta[n].qid, counts: {} }));
    mats.forEach((m, i) => {
      if (!seen.has(m.topic)) seen.set(m.topic, { name: m.topic, fr: '', group: m.group, order: 5000 + i, icon: '', qid: 0, counts: {} });
      const tp = seen.get(m.topic); if (!tp.group) tp.group = m.group; tp.counts[m.level] = (tp.counts[m.level] || 0) + 1;
    });
    const topics = [...seen.values()].sort((a, b) => a.order - b.order);
    topics.forEach((tp, i) => { if (!tp.group) tp.group = '기타'; tp.color = PASTELS[i % PASTELS.length]; });
    const groups = [];
    topics.forEach(tp => { let g = groups.find(x => x.name === tp.group); if (!g) { g = { name: tp.group, topics: [] }; groups.push(g); } g.topics.push(tp); });
    let groupFr = {};   // 대주제 프랑스어(설정 group_fr, 관리자 화면 분류 → 이름에서 고침)
    try { groupFr = JSON.parse((raw.settings || {}).group_fr || '{}') || {}; } catch (e) { groupFr = {}; }
    data = { settings: raw.settings || {}, topics, groups, materials: mats, groupFr, updatedAt: raw.updatedAt || '' };
  }
  // 화면에 보이는 대주제 이름(프랑스어 화면이면 프랑스어). 값(고르기·거르기)은 늘 한국어 이름
  const gName = n => (lang === 'fr' && data.groupFr && data.groupFr[n]) || n;
  const topicByQid = q => data.topics.find(x => x.qid && String(x.qid) === String(q));

  // ---------- 서버(Cloudflare /api, 2026-10-30 새 판) 또는 시험 모드 ----------
  // 읽기는 15초 안에 못 받으면 한 번 더, 로그인·올리기는 60초(파일은 120초)에서 끊는다(시트 서버가 370초 걸린 일, 10-26).
  // 파일은 base64 대신 바이트 그대로 보내고, 나머지 내용은 머리글 X-Oneshot에 싣는다(서버가 바로 보관함에 흘려 넣게).
  const timed = (ms, go) => { const c = new AbortController(), tm = setTimeout(() => c.abort(), ms); return go(c.signal).finally(() => clearTimeout(tm)); };
  const api = {
    async load() {
      if (MOCK) return mockData();
      const once = () => timed(15000, signal => fetch(CFG.API_URL + '?action=data&t=' + Date.now(), { signal, cache: 'no-store' }).then(r => r.json()));
      try { return await once(); } catch (e) { return once(); }
    },
    async post(body, ms) {   // ms: AI처럼 오래 걸리는 요청의 기다리는 시간(없으면 60초, 파일은 120초)
      if (MOCK) return mockPost(body);
      if (body.file && (body.file.data || body.file.blob)) {
        const f = body.file;
        let bytes = f.blob;   // 화면이 만든 파일(활동지 PDF)은 그대로 보낸다
        if (!bytes) {
          const bin = atob(f.data);
          bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        }
        const meta = Object.assign({}, body, { file: { name: f.name, type: f.type || '' } });
        return timed(120000, signal => fetch(CFG.API_URL, { method: 'POST', body: bytes, signal,
          headers: { 'Content-Type': f.type || 'application/octet-stream', 'X-Oneshot': encodeURIComponent(JSON.stringify(meta)) } }).then(r => r.json()));
      }
      return timed(ms || 60000, signal => fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify(body), signal }).then(r => r.json()));
    }
  };
  function mockStore() { try { return JSON.parse(localStorage.getItem('oneshot.mock') || '{"uploads":[],"hidden":[],"teachers":[]}'); } catch (e) { return { uploads: [], hidden: [], teachers: [] }; } }
  function mockSave(s) { try { localStorage.setItem('oneshot.mock', JSON.stringify(s)); } catch (e) {} }
  function mockData() {
    const s = mockStore();
    const materials = [...SAMPLE.materials, ...s.uploads].filter(m => !s.hidden.includes(m.id));
    return Promise.resolve({ ok: true, settings: SAMPLE.settings, topics: SAMPLE.topics, materials, updatedAt: new Date().toISOString() });
  }
  function mockPost(b) {
    const s = mockStore();
    const teachers = [...(SAMPLE.teachers || []), ...(s.teachers || [])];
    if (b.action === 'report') return Promise.resolve({ ok: true });   // 시험 모드: 받은 척만
    if (b.action === 'join') {   // 시험 모드 가입: 가입 코드는 sample-data.js joinCode, 만든 교사는 이 기기에만 남는다
      if (String(b.joinCode || '').replace(/\s+/g, '').toUpperCase() !== String(SAMPLE.joinCode || '').toUpperCase()) return Promise.resolve({ ok: false, error: 'bad_join' });
      const name = String(b.name || '').replace(/\s+/g, ' ').trim(), key = x => String(x).replace(/\s+/g, '').toLowerCase();
      if (teachers.some(x => key(x.name) === key(name))) return Promise.resolve({ ok: false, error: 'dup_name' });
      const code = String(10000000 + Math.floor(Math.random() * 90000000));
      s.teachers = [...(s.teachers || []), { code, name, school: b.school }]; mockSave(s);
      return Promise.resolve({ ok: true, teacher: { name, school: b.school }, code });
    }
    const tc = teachers.find(x => x.code === String(b.code || ''));
    const favs = Object.assign({}, s.favs);   // 시험 모드 즐겨찾기: 이 기기에만(교사 코드별)
    if (b.action === 'login') return Promise.resolve(tc ? { ok: true, teacher: { name: tc.name, school: tc.school }, favs: favs[tc.code] || [] } : { ok: false, error: 'bad_code' });
    if (!tc) return Promise.resolve({ ok: false, error: 'bad_code' });
    if (b.action === 'leave') {   // 시험 모드: 이 기기에 만든 교사와 그 교사가 올린 자료만 지운다
      s.teachers = (s.teachers || []).filter(x => x.code !== tc.code); s.uploads = s.uploads.filter(x => x.by !== tc.name); mockSave(s);
      return Promise.resolve({ ok: true });
    }
    if (b.action === 'fav') {
      const list = (favs[tc.code] || []).filter(x => x !== String(b.id)); if (b.on) list.unshift(String(b.id));
      favs[tc.code] = list; s.favs = favs; mockSave(s); return Promise.resolve({ ok: true, favs: list });
    }
    if (b.action === 'upload') {
      const m = Object.assign({}, b.material, { id: 'u' + Date.now(), by: tc.name, date: new Date().toISOString().slice(0, 10) });
      if (b.file) m.url = 'https://example.org/oneshot-file/' + encodeURIComponent(b.file.name);   // 시험 모드: 드라이브 대신 견본 주소
      s.uploads.push(m); mockSave(s); return Promise.resolve({ ok: true, id: m.id });
    }
    if (b.action === 'hide' || b.action === 'delete') {
      const all = [...SAMPLE.materials, ...s.uploads]; const m = all.find(x => String(x.id) === String(b.id));
      if (!m || s.hidden.includes(String(b.id))) return Promise.resolve({ ok: false, error: 'not_found' });
      if (m.by && m.by !== tc.name) return Promise.resolve({ ok: false, error: 'not_owner' });
      if (b.action === 'delete') s.uploads = s.uploads.filter(x => String(x.id) !== String(b.id));
      s.hidden.push(String(b.id)); mockSave(s); return Promise.resolve({ ok: true });
    }
    return Promise.resolve({ ok: false, error: 'unknown' });
  }

  // ---------- 교사 로그인 상태(교사 기기에만 저장) ----------
  function loadTeacher() { try { return JSON.parse(localStorage.getItem('oneshot.teacher') || 'null'); } catch (e) { return null; } }
  function saveTeacher(x) { try { x ? localStorage.setItem('oneshot.teacher', JSON.stringify(x)) : localStorage.removeItem('oneshot.teacher'); } catch (e) {} }

  // ---------- 작은 조각 ----------
  function topicHref(name, level) { return '#/t/' + encodeURIComponent(name) + (level ? '/' + encodeURIComponent(level) : ''); }
  // 짧은 QR 주소(2026-10-31): 소주제 고정 번호 #/q/<qid>/<1|2|3>(하·중·상). 이름을 바꿔도 인쇄한 QR이 그대로 열리고 QR 칸이 성글다.
  // 번호가 없으면(시험 모드·번호 매기기 전) 이름 주소 그대로. 옛 #/t/ 주소도 계속 열린다
  function qHref(tp, level) { const i = LEVEL_KEYS.indexOf(level); return tp && tp.qid ? '#/q/' + tp.qid + (i >= 0 ? '/' + (i + 1) : '') : topicHref(tp ? tp.name : '', level); }
  // 자료 QR은 /go/<자료 id>를 담는다: 서버가 지금 링크로 넘기므로 관리자 화면에서 링크를 고쳐도 인쇄한 QR은 그대로(시험 모드는 링크 그대로)
  const goUrl = m => MOCK ? m.url : new URL('go/' + encodeURIComponent(m.id), location.href.split('#')[0]).href;
  function fullUrl(hash) { return location.href.split('#')[0] + hash; }
  function topicLabel(tp) { return lang === 'fr' && tp.fr ? { big: tp.fr, small: tp.name } : { big: tp.name, small: tp.fr }; }
  function topicIcon(tp) {
    if (tp.icon) return { v: tp.icon, txt: !/\p{Extended_Pictographic}/u.test(tp.icon) };
    for (const [re, v] of TOPIC_ICONS) if (re.test(tp.name)) return v.indexOf('txt:') === 0 ? { v: v.slice(4), txt: true } : { v, txt: false };
    return { v: tp.name.replace(/\s/g, '').slice(0, 1), txt: true };
  }
  function langToggle(small) {
    return `<div class="lang${small ? ' sm' : ''}"><button type="button" data-lang="ko" class="${lang === 'ko' ? 'on' : ''}">${small ? '한' : '한국어'}</button><button type="button" data-lang="fr" class="${lang === 'fr' ? 'on' : ''}">FR</button></div>`;
  }
  function appTitle() { return data.settings.title || CFG.TITLE || '한글원샷'; }
  // 자료실 위: 첫 화면 QR 단추(QR 탭을 없애며 옮김, 2026-10-24)
  function barHome() { return `<header class="appbar"><a class="brand" href="#/"><img class="hlogo" src="icons/logo-h.svg" alt="${esc(appTitle())}"></a><span class="hbtns">${langToggle(true)}<a class="circ" href="#/qr" aria-label="${esc(t('homeQrBtn'))}">${ICON.qr}</a></span></header>`; }
  const isFav = id => !!(teacher && (teacher.favs || []).includes(id));
  const starBtn = m => { const on = isFav(m.id); return `<button type="button" class="star${on ? ' on' : ''}" data-fav="${esc(m.id)}" aria-pressed="${on}" aria-label="${esc(t(on ? 'favOff' : 'favOn'))}">${ICON.star}</button>`; };
  // 신고 단추(자료 카드마다, 로그인 없이) · 개인정보처리방침·이용 규칙 링크(프랑스어 화면이면 그 절로)
  const rpLink = m => `<a class="rpbtn" href="#/report/${encodeURIComponent(m.id)}" aria-label="${esc(t('rpBtn'))}" title="${esc(t('rpBtn'))}">${ICON.flag}</a>`;
  const policyHref = p => `${p}.html${lang === 'fr' ? '#fr' : ''}`;
  const policyLinks = () => `<a href="${policyHref('privacy')}" target="_blank" rel="noopener">${esc(t('privacyLink'))}</a> · <a href="${policyHref('terms')}" target="_blank" rel="noopener">${esc(t('termsLink'))}</a>`;
  function barSub(title, backHref, right) {
    const left = backHref ? `<a class="circ" href="${backHref}" aria-label="${esc(t('back'))}">${ICON.back}</a>` : '<span class="circ ghost"></span>';
    return `<header class="appbar">${left}<b class="atitle">${esc(title)}</b>${right || langToggle(true)}</header>`;
  }
  function matInner(m, withTopic) {
    const [emo, bg] = TYPE_ICON[m.type] || TYPE_ICON['기타'];
    // 학교 뒤에 올린 선생님 이름(휴먼쌤 2026-10-26 "카드에 이름이 보이도록"). 학교 칸이 '휴먼쌤'인 휴먼쌤 자료는 이름을 붙이지 않는다.
    // 유형은 그림 아래로, 학교 이름 끝의 '한글학교'는 뺀다(휴먼쌤 2026-10-26 "몽펠리에 한글학교 처럼 뒷부분의 '한글학교'는 생략해줘").
    // withTopic: true = 소주제 · 레벨(찾기·즐겨찾기), 'mine' = 레벨 · 올린 날짜(내 자료는 소주제별로 묶여 있어서)
    const by = withTopic || m.school === '휴먼쌤' ? '' : m.by;
    const school = withTopic ? '' : m.school.replace(/\s*한글학교$/, '');
    const meta = withTopic === 'mine' ? t('lvDate')(m.level, m.date)
      : [withTopic ? `${m.topic} · ${m.level}` : '', m.minutes ? m.minutes + t('min') : '', school, by].filter(Boolean).join(' · ');
    const ds = (lang === 'fr' && m.descFr) || m.desc;   // 프랑스어 화면은 프랑스어 설명이 있으면 그것을(2026-11-05)
    return `<span class="tic"><span class="ti" style="background:${bg}">${emo}</span>${m.type ? `<span class="ty">${esc(m.type)}</span>` : ''}</span>`
      + `<span class="tx"><span class="tt">${esc(m.title)}</span>${meta ? `<span class="meta">${esc(meta)}</span>` : ''}${ds ? `<span class="ds">${esc(ds)}</span>` : ''}</span>`;
  }
  const goBtn = m => `<span class="go k-${esc(m.level)}">${ICON.out}</span>`;

  // 소속 학교 선택지(config.js SCHOOLS). 값은 한국어 이름, 보이는 글은 언어에 따라. 이름에 도시가 없으면 도시를 붙인다.
  function schoolOptions(cur) {
    const fr = lang === 'fr';
    const label = s => { const n = fr ? s.fr : s.ko, c = fr ? s.cityFr : s.city; return c && n.indexOf(c) < 0 ? `${n} (${c})` : n; };
    const key = s => fr ? `${s.cityFr} ${s.fr}` : s.ko;
    const list = SCHOOLS.slice().sort((a, b) => key(a).localeCompare(key(b), fr ? 'fr' : 'ko'));
    if (cur && !list.some(s => s.ko === cur)) list.unshift({ ko: cur, fr: cur });   // 시트에 목록 밖 학교가 적혀 있으면 그대로 둔다
    return `<option value="">${esc(t('phSchool'))}</option>` + list.map(s => `<option value="${esc(s.ko)}"${s.ko === cur ? ' selected' : ''}>${esc(label(s))}</option>`).join('');
  }

  // 링크 알아보기: 자료 형식은 '링크 하나'로 통일한다. 학습자가 못 여는 링크는 막고, 고칠 점은 미리 알려 준다.
  function linkCheck(u) {
    u = String(u || '').trim();
    if (!u) return { lv: '', msg: t('lkAny') };
    let x; try { x = new URL(u); } catch (e) { return { lv: 'bad', msg: t('lkBad') }; }
    if (!/^https?:$/.test(x.protocol)) return { lv: 'bad', msg: t('lkBad') };
    const h = x.hostname.replace(/^www\./, ''), p = x.pathname;
    if (/^(localhost|127\.|10\.|192\.168\.|0\.0\.0\.0)/.test(h) || /\.local$/.test(h)) return { lv: 'bad', msg: t('lkLocal') };
    let r;
    if (h === 'drive.google.com') r = /\/(folders|my-drive)\b/.test(p) ? { lv: 'warn', msg: t('lkFolder') } : { lv: 'ok', msg: t('lkDrive') };
    else if (h === 'docs.google.com') r = /^\/forms\//.test(p) ? { lv: 'ok', msg: t('lkForm') } : /\/copy\b/.test(p) ? { lv: 'warn', msg: t('lkCopy') } : { lv: 'ok', msg: t('lkDocs') };
    else if (/(^|\.)youtube\.com$/.test(h) || h === 'youtu.be') r = { lv: 'ok', msg: t('lkYoutube') };
    else r = { lv: 'ok', msg: t('lkSite') };
    if (x.protocol === 'http:' && r.lv === 'ok') r = { lv: 'warn', msg: t('lkHttp') };
    return r;
  }
  function linkHint(r) { return `<span class="m">${{ ok: '✓', warn: '!', bad: '×' }[r.lv] || 'i'}</span><span>${esc(r.msg)}</span>`; }
  // 같은 링크 알아보기(2026-10-31 2차 '같은 링크 경고'). 막지는 않고 알려만 준다. www·m.·끝의 /·http(s) 차이,
  // 유튜브(youtu.be·watch·shorts)와 구글 드라이브·문서(/d/<id>/…) 주소 꼴 차이는 같은 링크로 본다.
  function linkKey(u) {
    let x; try { x = new URL(String(u || '').trim()); } catch (e) { return ''; }
    if (!/^https?:$/.test(x.protocol)) return '';
    const h = x.hostname.toLowerCase().replace(/^(www|m)\./, ''), p = x.pathname.replace(/\/+$/, '');
    let m;
    if (h === 'youtu.be' && p.length > 1) return 'yt:' + p.slice(1);
    if (/(^|\.)youtube\.com$/.test(h)) { if (x.searchParams.get('v')) return 'yt:' + x.searchParams.get('v'); if ((m = p.match(/^\/(shorts|embed|live)\/([^/]+)/))) return 'yt:' + m[2]; }
    if ((h === 'drive.google.com' || h === 'docs.google.com') && (m = p.match(/\/d\/(?:e\/)?([^/]+)/))) return 'g:' + m[1];
    if (h === 'drive.google.com' && x.searchParams.get('id')) return 'g:' + x.searchParams.get('id');
    return h + p + x.search;
  }
  function dupOf(u, exceptId, list) { const k = linkKey(u); return k ? (list || data.materials).find(m => m.id !== exceptId && linkKey(m.url) === k) || null : null; }

  // ---------- 화면 ----------
  function viewHome() {
    const groups = data.groups;

    const shown = sel ? groups.filter(g => g.name === sel) : groups;

    const search = data.materials.length ? `<label class="srch lib">${ICON.search}<input id="libQ" type="search" enterkeyhint="search" placeholder="${esc(t('libSearch'))}" value="${esc(libQ)}" aria-label="${esc(t('libSearch'))}">`
      + `<button type="button" class="sx" data-libqx aria-label="${esc(t('clearQ'))}"${libQ ? '' : ' hidden'}>✕</button></label>` : '';
    return barHome() + `<div class="pad">${hero}${notice}${search}${chips}<div id="libBody">${libBody(shown)}</div>${footLine()}</div>`;

  // 자료실 글자 찾기(2026-10-25 휴먼쌤 "즐겨찾기 탭에 있는 검색창은 없애주고 대신 자료실에는 신규로 만들어줘").
  // 제목·주제(프랑스어 이름도)·설명·유형·묶음에서 찾고, 묶음 칩을 골라 두었으면 그 안에서. 글자가 없으면 주제 카드 그대로.
  function libShown() {
    const q = libQ.replace(/\s+/g, '').toLowerCase();
    const sel = data.groups.some(g => g.name === groupFilter) ? groupFilter : '';
    return data.materials.filter(m => {
      const tp = data.topics.find(x => x.name === m.topic);
      return (!sel || groupOf(m) === sel) && [m.title, m.topic, tp && tp.fr, m.desc, m.descFr, m.type, groupOf(m)].join('').replace(/\s+/g, '').toLowerCase().includes(q);
    });

  function libBody(shown) {
    if (libQ.trim()) {

  // ---------- 즐겨찾기(#/fav) ----------
  // 교사가 자료실에서 ☆로 담아 둔 자료. 필터(묶음·주제·레벨·유형) + 정렬. 카드마다 QR 단추(학생에게 보여 주기).
  // 글자 찾기는 자료실로 옮김(2026-10-25 휴먼쌤 "즐겨찾기 탭에 있는 검색창은 없애주고 대신 자료실에는 신규로 만들어줘").
  const FAV_KEYS = ['group', 'topic', 'level', 'type'];
  const favLab = k => t({ group: 'fGroup', topic: 'fTopic', level: 'fLevel', type: 'fType' }[k]);
  function groupOf(m) { const tp = data.topics.find(x => x.name === m.topic); return tp ? tp.group : m.group; }
  function favAll() { const by = new Map(data.materials.map(m => [m.id, m])); return ((teacher && teacher.favs) || []).map(id => by.get(id)).filter(Boolean); }
  function favVal(m, k) { return k === 'group' ? groupOf(m) : m[k]; }
  function favShown() {
    let list = favAll().filter(m => FAV_KEYS.every(k => !favF[k].length || favF[k].includes(favVal(m, k))));
    if (favSort === 'title') list = list.slice().sort((a, b) => a.title.localeCompare(b.title, 'ko'));
    if (favSort === 'topic') {
      const ord = new Map(data.topics.map((x, i) => [x.name, i]));
      list = list.slice().sort((a, b) => (ord.get(a.topic) - ord.get(b.topic)) || (LEVEL_KEYS.indexOf(a.level) - LEVEL_KEYS.indexOf(b.level)));
    }
    return list;
  }
  // 필터 칩에 쓸 값: 담은 자료에 실제로 있는 것만(레벨은 늘 하·중·상, 휴먼쌤 10-25 "레벨은 상  은 없어,"). 소주제는 고른 대주제가 있으면 그 안에서.
  function favChoices(all) {
    const uniq = a => [...new Set(a)];
    const topicOrder = data.topics.map(x => x.name), groupOrder = data.groups.map(g => g.name);
    const inG = m => !favF.group.length || favF.group.includes(groupOf(m));
    const byOrder = (vals, order) => vals.sort((a, b) => (order.indexOf(a) + 1 || 1e9) - (order.indexOf(b) + 1 || 1e9));
    return {
      group: byOrder(uniq(all.map(groupOf)), groupOrder),
      topic: byOrder(uniq(all.filter(inG).map(m => m.topic)), topicOrder),
      level: LEVEL_KEYS.slice(),
      type: byOrder(uniq(all.map(m => m.type)), TYPES)
    };
  }
  function favRow(m) {
    return `<div class="item mat fav"><a href="${esc(m.url)}" target="_blank" rel="noopener">${matInner(m, true)}</a>`
      + `<a class="qrpill" href="#/mq/${encodeURIComponent(m.id)}">${ICON.qr}<span>QR</span></a><div class="matside">${starBtn(m)}${rpLink(m)}</div></div>`;

  function favListHtml(all, shown) {
    if (!all.length) return `<div class="emptycard"><div class="e">⭐</div>${esc(t('favEmpty'))}<small>${esc(t('favEmptyHint'))}</small><a class="btn" href="#/">${esc(t('toLib'))}</a></div>`;

  function viewFav() {
    if (!teacher) {   // 로그인 전: 탭은 그대로, 안내창 → 선생님 탭
      return `<header class="appbar"><b class="atitle">${esc(t('tabFav'))}</b>${langToggle(true)}</header><div class="pad favghost"><i></i><i></i><i></i><i></i></div>
        <div class="fdim"></div><div class="fmodal" role="dialog" aria-modal="true" aria-labelledby="favNeed"><div class="e">⭐</div><h2 id="favNeed">${esc(t('favNeedLogin'))}</h2>

    }
    const all = favAll(), shown = favShown(), ch = favChoices(all);
    const nF = FAV_KEYS.reduce((s, k) => s + favF[k].length, 0);
    const head = `<header class="appbar favtop"><b class="atitle">${esc(t('tabFav'))}</b><span class="hbtns"><span class="cnt">${esc(t('favCount')(all.length))}</span>${langToggle(true)}</span></header>`;
    // 필터: 팝업 없이 이 화면 안에서 바로 누른다(2026-10-25 휴먼쌤 "별도 팝업창 띄우지말고 여기 내에서 클릭으로 해결할수있께").
    // 줄마다 하나만 고르고, 고른 칩을 다시 누르거나 '전체'를 누르면 풀린다. 고를 것이 하나뿐인 줄은 감춘다.
    const fo = (k, v, lab, on, cls) => `<button type="button" class="fo${cls || ''}${on ? ' on' : ''}" data-fk="${k}" data-fv="${esc(v)}" aria-pressed="${on}">${esc(lab)}</button>`;
    const row = k => (ch[k].length > 1 || favF[k].length) ? `<div class="frow"><span class="fl">${esc(favLab(k))}</span><div class="fopts">${fo(k, '', t('all'), !favF[k].length)}`
      + ch[k].map(v => fo(k, v, k === 'group' ? gName(v) : v, favF[k].includes(v), k === 'level' ? ' k-' + v + (all.some(m => m.level === v) ? '' : ' zero') : '')).join('') + `</div></div>` : '';
    const srt = ['added', 'title', 'topic'].map(s => `<button type="button" class="fo srt${favSort === s ? ' on' : ''}" data-fsort="${s}" aria-pressed="${favSort === s}">${esc(t({ added: 'sortAdded', title: 'sortTitle', topic: 'sortTopic' }[s]))}</button>`).join('');
    const tools = all.length ? `<div class="fpanel">${FAV_KEYS.map(row).join('')}${all.length > 1 ? `<div class="frow"><span class="fl">${esc(t('sortK'))}</span><div class="fopts">${srt}</div></div>` : ''}</div>`
        + `<div class="rhead"><b id="favFound">${esc(t('favFound')(shown.length))}</b>${nF ? `<button type="button" data-freset>${esc(t('reset'))}</button>` : ''}</div>` : '';
    return head + `<div class="pad">${tools}<div id="favList">${favListHtml(all, shown)}</div></div>`;
  }
  async function toggleFav(b) {
    if (!teacher) return;
    const id = b.dataset.fav, on = !isFav(id), before = (teacher.favs || []).slice();
    teacher.favs = on ? [id].concat(before.filter(x => x !== id)) : before.filter(x => x !== id);
    saveTeacher(teacher); render(true); toast(t(on ? 'favAdded' : 'favRemoved'));
    try {
      const r = await api.post({ action: 'fav', code: teacher.code, id, on });
      if (r.ok && Array.isArray(r.favs)) { teacher.favs = r.favs; saveTeacher(teacher); }
      else throw new Error(r.error || 'fav');
    } catch (ex) { if (teacher) { teacher.favs = before; saveTeacher(teacher); render(true); } toast(t('netErr')); }
  }

  let mineGroup = '';
  function viewMine() {
    if (!teacher) return viewLogin(true);
    // 내 자료: 서버가 로그인 때 준 내 자료 번호로 가린다(2026-10-31 — 공개 자료의 올린이 이름은 숨길 수 있어서). 번호가 없으면(시험 모드) 이름으로
    const ids = Array.isArray(teacher.mine) ? new Set(teacher.mine) : null;
    const mine = data.materials.filter(m => ids ? ids.has(m.id) : m.by === teacher.name);
    const tpOf = new Map(data.topics.map(tp => [tp.name, tp]));
    const gOf = m => (tpOf.get(m.topic) || {}).group || m.group || '기타';
    const groups = data.groups.map(g => ({ name: g.name, n: mine.filter(m => gOf(m) === g.name).length })).filter(g => g.n);
    if (!groups.some(g => g.name === mineGroup)) mineGroup = '';
    const chips = groups.length > 1 ? `<div class="chips mchips">${[{ name: '', n: mine.length }].concat(groups).map(g =>
      `<button type="button" class="chip${g.name === mineGroup ? ' on' : ''}" data-mg="${esc(g.name)}">${esc(g.name ? gName(g.name) : t('all'))} <small>${g.n}</small></button>`).join('')}</div>` : '';
    const lvI = l => { const i = LEVEL_KEYS.indexOf(l); return i < 0 ? 9 : i; };
    const secs = data.topics.map(tp => {
      const list = mine.filter(m => m.topic === tp.name && (!mineGroup || gOf(m) === mineGroup))
        .sort((a, b) => lvI(a.level) - lvI(b.level) || String(b.date).localeCompare(String(a.date)));

  function bindLogin() {

  // 고르기 목록(주제·묶음 칸): items = [{ v, label, sub, em, emTxt, bg, group }]. 적은 글자로 거르고, 딱 맞는 게 없으면 '새로 쓰기' 줄을 둔다.
  // 고르면 칸에 v를 넣고 change를 보내 폼이 다시 맞춘다(input을 보내면 목록이 다시 열려서).
  function bindCombo(box, items, newLabel) {
    const inp = box.querySelector('input'), list = box.querySelector('.cblist'), tog = box.querySelector('.tog');
    const norm = s => String(s || '').replace(/\s+/g, '').toLowerCase();
    let shown = [], at = -1, hasNew = false;
    const draw = () => {
      const q = norm(inp.value), exact = items.some(x => norm(x.v) === q);
      shown = q && !exact ? items.filter(x => norm(x.v + ' ' + x.label + ' ' + (x.sub || '')).includes(q)) : items;   // 딱 맞으면 다 보여 준다(다른 것으로 바꾸기 쉽게)
      hasNew = !!q && !exact;
      let html = '', g = null;
      shown.forEach((x, i) => {
        if (x.group && x.group !== g) { g = x.group; html += `<div class="gh">${esc(g)}</div>`; }
        html += `<button type="button" class="cbo${i === at ? ' on' : ''}${norm(x.v) === q ? ' cur' : ''}" data-i="${i}" role="option" aria-selected="${norm(x.v) === q}">`
          + (x.em != null ? `<span class="em${x.emTxt ? ' txt' : ''}" style="background:${x.bg || '#F6EEE4'}">${esc(x.em)}</span>` : '')
          + `<span>${esc(x.label)}</span>${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</button>`;
      });
      if (hasNew) html += `<button type="button" class="cbo new${at === shown.length ? ' on' : ''}" data-new="1" role="option"><span class="em">+</span><span>${esc(newLabel(inp.value.trim()))}</span></button>`;
      list.innerHTML = html || `<div class="cbempty">${esc(t('cbNone'))}</div>`;
    };
    const open = () => { at = -1; draw(); list.hidden = false; box.classList.add('open'); inp.setAttribute('aria-expanded', 'true'); };
    const close = () => { list.hidden = true; box.classList.remove('open'); inp.setAttribute('aria-expanded', 'false'); };
    const done = () => { close(); inp.dispatchEvent(new Event('change', { bubbles: true })); };
    inp.addEventListener('focus', open);
    inp.addEventListener('input', () => { if (list.hidden) open(); else { at = -1; draw(); } });
    inp.addEventListener('blur', () => setTimeout(close, 150));
    inp.addEventListener('keydown', e => {
      const n = shown.length + (hasNew ? 1 : 0);
      if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && n) {
        e.preventDefault(); if (list.hidden) open();
        const d = e.key === 'ArrowDown' ? 1 : -1;
        at = at < 0 ? (d > 0 ? 0 : n - 1) : (at + d + n) % n; draw();
        const on = list.querySelector('.cbo.on'); if (on) on.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        // 폰 키보드의 '이동·완료'(엔터)가 폼을 바로 보내지 않게: 적은 글자 그대로 소주제로 쓰고 키보드만 닫는다
        // (전에는 새 소주제를 적고 엔터를 누르면 레벨·제목이 빈 채로 보내져 '꼭 적어 주세요'가 떴다, 2026-10-26)
        e.preventDefault(); if (e.isComposing) return;
        if (!list.hidden && at >= 0 && at < shown.length) inp.value = shown[at].v;
        done(); inp.blur();
      } else if (e.key === 'Escape') close();
    });
    // 목록을 눌러도 칸이 포커스를 잃지 않게(그래야 누르기 전에 목록이 닫히지 않는다). 손가락으로 끌어 내리는 것은 그대로 된다.
    list.addEventListener('pointerdown', e => e.preventDefault());
    list.addEventListener('click', e => {
      const b = e.target.closest('.cbo'); if (!b) return;
      if (!b.dataset.new) inp.value = shown[+b.dataset.i].v;
      done();
    });
    tog.addEventListener('pointerdown', e => e.preventDefault());
    tog.addEventListener('click', () => { if (list.hidden) { inp.focus(); open(); } else close(); });
  }
  function topicItems() {
    return data.groups.flatMap(g => g.topics.map(tp => { const L = topicLabel(tp), ic = topicIcon(tp); return { v: tp.name, label: L.big, sub: L.small, em: ic.v, emTxt: ic.txt, bg: tp.color, group: g.name }; }));
  }

    const fileOk = fl => !fl ? { lv: 'bad', msg: t('needFile') } : !fl.size ? { lv: 'bad', msg: t('fileReadErr') } : !FILE_EXT.includes(fileExt(fl.name)) ? { lv: 'bad', msg: t('fileBad') }
      : fl.size > FILE_MAX_MB * 1048576 ? { lv: 'bad', msg: t('fileBig')(FILE_MAX_MB) } : { lv: 'ok', msg: t(isHtmlName(fl.name) ? 'fileHtml' : 'fileKeep') };
    // HTML이 따로 있는 파일을 부르면 올린 뒤 깨지므로 미리 알린다(앞 2MB만 본다)
    const htmlAssets = async fl => { try { return /(?:src|href)\s*=\s*["'](?!https?:|data:|#|mailto:|tel:|\/\/|javascript:|blob:)[^"']+\.(?:png|jpe?g|gif|svg|webp|mp3|mp4|wav|ogg|css|js)["']/i.test(await fl.slice(0, 2097152).text()); } catch (e) { return false; } };
    const syncFile = async () => {
      const fl = $('#f-file').files[0], r = fl ? fileOk(fl) : { lv: '', msg: t('fileKeep') }, h = $('#fileHint');
      $('#fileBox').classList.toggle('has', !!fl && r.lv === 'ok');
      $('#fileName').innerHTML = fl ? `${esc(fl.name)}<small>${(fl.size / 1048576).toFixed(1)}MB</small>` : `${esc(t('pickFile'))}<small>${esc(t('fileWhat')(FILE_MAX_MB))}</small>`;
      h.className = 'lhint' + (r.lv ? ' ' + r.lv : ''); h.innerHTML = linkHint(r);
      if (fl && r.lv === 'ok' && !el('title').value.trim()) { el('title').value = fl.name.replace(/\.[^.]+$/, '').slice(0, 60); pv(); }
      if (fl && r.lv === 'ok' && isHtmlName(fl.name) && await htmlAssets(fl) && $('#f-file') && $('#f-file').files[0] === fl) { h.className = 'lhint warn'; h.innerHTML = linkHint({ lv: 'warn', msg: t('fileHtmlAsset') }); }
    };
    $('#f-file').addEventListener('change', e => { e.stopPropagation(); syncFile(); });
    f.querySelectorAll('[data-src]').forEach(b => b.onclick = () => {
      upSrc = b.dataset.src;
      f.querySelectorAll('[data-src]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.src === upSrc)));
      $('#srcFile').hidden = upSrc !== 'file'; $('#srcLink').hidden = upSrc !== 'link';
    });
    const readB64 = fl => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => no(r.error); r.readAsDataURL(fl); });
    f.addEventListener('input', sync); f.addEventListener('change', sync); sync();
    const ps = f.querySelector('[data-paste]');
    if (ps) ps.onclick = async () => { try { const s = (await navigator.clipboard.readText()).trim(); if (s) { el('url').value = s; sync(); } else el('url').focus(); } catch (ex) { el('url').focus(); } };
    // AI로 칸 채우기(2026-11-05): 선생님이 직접 건드린 칸은 덮어쓰지 않는다. 미리 정해져 온 소주제·레벨도 그대로 둔다
    const touched = new Set();
    if (el('topic').value) touched.add('topic');
    if (el('level').value) touched.add('level');
    const touch = e => { if (e.target && e.target.name) touched.add(e.target.name); };
    f.addEventListener('input', touch); f.addEventListener('change', touch);
    const ab = $('#aiFill');
    if (ab) ab.onclick = async () => {
      const h = $('#aiHint'), say = (lv, msg) => { h.className = 'lhint' + (lv ? ' ' + lv : ''); h.innerHTML = linkHint({ lv, msg }); };
      const fl = upSrc === 'file' ? $('#f-file').files[0] : null, url = upSrc === 'link' ? el('url').value.trim() : '';
      if (upSrc === 'file' ? !fl : (!url || linkCheck(url).lv === 'bad')) return say('bad', t('aiNeedSrc'));
      const label = ab.querySelector('span'); ab.disabled = true; label.textContent = t('aiFillBusy');
      try {
        const body = { action: 'ai_fill', code: teacher.code, lang, title: touched.has('title') ? el('title').value.trim() : '' };
        if (fl && isHtmlName(fl.name)) body.page = await htmlText(fl);   // HTML은 파일 대신 뽑은 글을 보낸다
        else if (fl) {
          if (!FILE_EXT.includes(fileExt(fl.name))) { say('bad', t('fileBad')); return; }
          const small = await aiShrink(fl);
          if (!small) { say('warn', t('aiHeic')); return; }
          if (small.size > AI_FILE_MAX_MB * 1048576) { say('bad', t('aiErr').ai_big); return; }
          body.file = { name: small.name, type: small.type || '', data: await readB64(small) };
        } else body.url = url;
        const r = await api.post(body, 120000);
        if (r.ok) {
          const x = r.fill || {}, put = (n, v) => { if (v && !touched.has(n)) el(n).value = v; };
          put('title', x.title); put('type', x.type); put('level', x.level); put('desc', x.desc); put('desc_fr', x.desc_fr); put('topic', x.topic); put('group', x.group);
          sync(); say('ok', [t('aiFilled'), x.why, r.left != null ? t('aiLeft')(r.left) : ''].filter(Boolean).join(' '));
        } else if (r.error === 'bad_code') { teacher = null; saveTeacher(null); location.hash = '#/login'; }
        else say('bad', t('aiErr')[r.error] || t('netErr'));
      } catch (ex) { say('bad', t('netErr')); }
      finally { if (ab.isConnected) { ab.disabled = false; label.textContent = t('aiFillBtn'); } }
    };
    f.onsubmit = async e => {
      e.preventDefault(); const err = $('#upErr'); err.textContent = '';
      const topic = el('topic').value.trim(); const known = data.topics.find(x => x.name === topic);
      const material = { group: known ? known.group : (el('group').value.trim() || '기타'), topic, level: el('level').value || '', title: el('title').value.trim(),
        type: el('type').value, url: upSrc === 'link' ? el('url').value.trim() : '', desc: el('desc').value.trim(), desc_fr: el('desc_fr').value.trim(), minutes: 0, school: el('school').value.trim() };
      const fail = msg => { err.textContent = msg; toast(msg); };
      if (SCHOOLS.length && !material.school) { el('school').focus(); return fail(t('needSchool')); }
      const fl = upSrc === 'file' ? $('#f-file').files[0] : null;
      if (upSrc === 'file') { const fr = fileOk(fl); if (fr.lv === 'bad') return fail(fr.msg); }
      // 빠진 칸을 하나씩 짚어 알려 주고 그 칸으로 데려간다(전에는 네 칸을 한꺼번에 말해 어디가 빠졌는지 몰랐다)
      const miss = !material.topic ? ['needTopic', el('topic')] : !material.level ? ['needLevel', f.querySelector('.seg3')]
        : !material.title ? ['needTitle', el('title')] : upSrc === 'link' && !material.url ? ['needUrl', el('url')] : null;
      if (miss) { miss[1].scrollIntoView({ block: 'center', behavior: 'smooth' }); if (miss[1].focus && miss[1].tagName === 'INPUT') miss[1].focus({ preventScroll: true }); return fail(t(miss[0])); }
      if (upSrc === 'link') { const lk = linkCheck(material.url); if (lk.lv === 'bad') { el('url').focus(); return fail(lk.msg); } }
      if (upSrc === 'link' && dupOf(material.url) && !confirm(t('dupAsk'))) return;
      const terms = el('terms');
      if (terms && !terms.checked) { terms.scrollIntoView({ block: 'center', behavior: 'smooth' }); return fail(t('needTerms')); }
      const btn = $('#upBtn'); btn.disabled = true; btn.textContent = t('uploading');
      try {
        let file = null;
        if (fl) {
          try {
            const up = isHtmlName(fl.name) ? await prepareHtml(fl) : fl;
            if (up.size > FILE_MAX_MB * 1048576) { btn.disabled = false; btn.textContent = t('submit'); return fail(t('fileBig')(FILE_MAX_MB)); }
            file = { name: up.name, type: up.type || '', size: up.size, data: await readB64(up) };
          } catch (ex) { btn.disabled = false; btn.textContent = t('submit'); return fail(t('fileReadErr')); }
        }
        const r = await api.post({ action: 'upload', code: teacher.code, material, file, agree: terms ? true : undefined });
        if (r.ok) {
          if (!teacher.terms) { teacher.terms = true; saveTeacher(teacher); }
          if (material.school !== teacher.school) { teacher.school = material.school; saveTeacher(teacher); }   // 다음에 올릴 때 이 학교가 먼저 골라져 있다
          if (Array.isArray(teacher.mine) && r.id) { teacher.mine = [r.id].concat(teacher.mine); saveTeacher(teacher); }
          await reload(); toast(t('uploaded')); location.hash = topicHref(material.topic, material.level);
        }
        else if (r.error === 'bad_code') { teacher = null; saveTeacher(null); location.hash = '#/login'; }
        else if (r.error === 'need_terms') { teacher.terms = false; saveTeacher(teacher); fail(t('needTerms')); }
        else fail({ file_big: t('fileBig')(FILE_MAX_MB), file_type: t('fileBad'), file_empty: t('fileReadErr'), file_save: t('netErr'), missing: t('required') }[r.error] || r.error || t('netErr'));
      } catch (ex) { fail(t('netErr')); }
      btn.disabled = false; btn.textContent = t('submit');
    };
  }
  // 사진은 AI로 보내기 전에 줄인다(긴 쪽 1568px JPEG). HEIC은 기기가 풀 수 있을 때만 된다(못 풀면 null). PDF는 그대로
  async function aiShrink(fl) {
    const ext = fileExt(fl.name);
    if (ext === 'pdf') return fl;
    try {
      const bmp = await createImageBitmap(fl), k = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
      return new File([blob], fl.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
    } catch (e) { return ext === 'heic' ? null : fl; }
  }

  // 쪽 그림(JPEG)을 A4 쪽마다 하나씩 담은 PDF 1.4 파일을 만든다
  async function wsPdf(S) {
    const pages = await wsPages(S), jpg = [];
    for (const cv of pages) {
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', WD.Q));
      if (!blob) throw new Error('toBlob');
      jpg.push(new Uint8Array(await new Response(blob).arrayBuffer()));
    }
    const enc = new TextEncoder(), parts = [], at = [], FIRST = 4, kid = i => FIRST + i * 3;
    let len = 0;
    const put = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
    const obj = (n, head, data) => { at[n] = len; put(`${n} 0 obj\n${head}\n`); if (data) { put('stream\n'); put(data); put('\nendstream\n'); } put('endobj\n'); };
    let title = 'FEFF';
    for (const u of String(S.ws.title)) for (let i = 0; i < u.length; i++) title += u.charCodeAt(i).toString(16).padStart(4, '0').toUpperCase();
    put('%PDF-1.4\n%âãÏÓ\n');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, `<< /Type /Pages /Count ${pages.length} /Kids [${pages.map((_, i) => `${kid(i)} 0 R`).join(' ')}] >>`);
    obj(3, `<< /Title <${title}> /Creator (Hangeul Oneshot) /Producer (Hangeul Oneshot) >>`);
    pages.forEach((cv, i) => {
      const n = kid(i), draw = enc.encode('q 595.28 0 0 841.89 0 0 cm /I Do Q');
      obj(n, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /I ${n + 2} 0 R >> >> /Contents ${n + 1} 0 R >>`);
      obj(n + 1, `<< /Length ${draw.length} >>`, draw);
      obj(n + 2, `<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg[i].length} >>`, jpg[i]);
    });
    const size = kid(pages.length), xref = len;
    let tbl = `xref\n0 ${size}\n0000000000 65535 f \n`;
    for (let n = 1; n < size; n++) tbl += String(at[n]).padStart(10, '0') + ' 00000 n \n';
    put(tbl + `trailer\n<< /Size ${size} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return new Blob(parts, { type: 'application/pdf' });
  }
  const wsName = w => (String(w.title).replace(/[\\/:*?"<>|]/g, '_').trim().slice(0, 60) || 'worksheet') + '.pdf';
  function wsDownload(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();

  }

        } catch (ex) { S.err = t('netErr'); }

      };
    }
    const wf = $('#aiWsForm');
    if (wf) {
      const F = aiWsS.f, el = n => wf.elements[n];
      wf.querySelectorAll('.cbx').forEach(box => box.dataset.cb === 'topic'
        ? bindCombo(box, topicItems(), s => t('cbNewTopic')(s))
        : bindCombo(box, data.groups.map(g => ({ v: g.name, label: g.name, sub: t('nTopics')(g.topics.length) })), s => t('cbNewGroup')(s)));
      const sync = () => {
        ['topic', 'group', 'level', 'kind', 'pages', 'who', 'expr', 'words'].forEach(n => { F[n] = String(el(n).value || '').trim(); });
        $('#w-groupField').hidden = !F.topic || data.topics.some(x => x.name === F.topic);
      };
      wf.addEventListener('input', sync); wf.addEventListener('change', sync); sync();
      wf.onsubmit = e => {
        e.preventDefault(); sync();
        const miss = !F.topic ? 'needTopic' : !F.level ? 'needLevel' : '';
        if (miss) { $('#aiErr').textContent = t(miss); return; }
        aiWsMake();
      };
    }
    const ed = $('#aiWsEdit');
    if (ed) {
      const S = aiWsS, w = S.ws;
      if ($('#wsPages')) wsShow();
      // 고친 글은 칠 때마다 초안에 적어 둔다(다시 그려도 사라지지 않게). 보기는 '/'로 나눈다
      ed.addEventListener('input', e => {
        const d = e.target.dataset; if (!d) return;
        if (d.wf) w[d.wf] = e.target.value;
        else if (d.wk) w.items[Number(d.wi)][d.wk] = d.wk === 'choices' ? e.target.value.split('/').map(x => x.trim()).filter(Boolean) : e.target.value;
        else return;
        S.pages = null;   // 문서는 다시 그린다
      });
      const sc = $('#w-school'); if (sc) sc.onchange = () => { S.school = sc.value; sc.classList.toggle('empty', !sc.value); };
      ed.addEventListener('click', async e => {
        const fail = m => { S.err = m; const x = $('#aiErr'); if (x) x.textContent = m; toast(m); };
        const ready = () => String(w.title).trim() && (w.items.some(x => String(x.q).trim()) || String(w.passage).trim());
        const D = e.target.closest('[data-wdel]'); if (D) { w.items.splice(Number(D.dataset.wdel), 1); S.pages = null; render(true); return; }
        if (e.target.closest('[data-wredo]')) { S.ws = null; S.pages = null; aiWsMake(); return; }
        if (e.target.closest('[data-wnew]')) { aiWsS = aiWsBlank(); render(); return; }
        if (e.target.closest('[data-wedit]')) { S.edit = true; S.err = ''; render(); window.scrollTo(0, 0); return; }
        if (e.target.closest('[data-wdone]')) {
          if (!ready()) return fail(t('aiWsNeed'));
          S.edit = false; S.err = ''; render(); window.scrollTo(0, 0); return;
        }
        if (e.target.closest('[data-wpdf]')) {
          S.busy = 'pdf'; S.err = ''; render(true);
          try { wsDownload(await wsPdf(S), wsName(w)); toast(t('aiWsPdfDone')); }
          catch (ex) { console.error('ws_pdf', ex); S.err = t('aiWsPdfErr'); }
          S.busy = false; aiRedraw();
          return;
        }
        if (!e.target.closest('[data-wsave]')) return;
        const terms = $('#w-terms'), school = S.school || teacher.school || '', F = S.f;
        if (SCHOOLS.length && !school) return fail(t('needSchool'));
        if (terms && !terms.checked) return fail(t('needTerms'));
        S.busy = true; S.err = ''; render(true);
        try {
          const known = data.topics.find(x => x.name === F.topic);
          // 화면에 보이는 그 문서를 PDF로 만들어 보통 파일 올리기 길로 올린다
          const r = await api.post({ action: 'upload', code: teacher.code, agree: terms ? true : undefined,
            material: { topic: F.topic, group: known ? known.group : (F.group || '기타'), level: F.level, title: w.title, desc: w.desc, desc_fr: w.desc_fr, school, type: F.kind === 'quiz' ? '퀴즈' : '활동지' },
            file: { name: wsName(w), type: 'application/pdf', blob: await wsPdf(S) } });
          if (aiLogout(r)) return;
          if (r.ok) {
            if (!teacher.terms) teacher.terms = true;
            if (school !== teacher.school) teacher.school = school;
            if (Array.isArray(teacher.mine) && r.id) teacher.mine = [r.id].concat(teacher.mine);
            saveTeacher(teacher);
            const go = topicHref(F.topic, F.level);
            aiWsS = aiWsBlank();
            await reload(); toast(t('uploaded')); location.hash = go;
            return;
          }
          if (r.error === 'need_terms') { teacher.terms = false; saveTeacher(teacher); S.err = t('needTerms'); }
          else if (r.error === 'file_big') S.err = t('fileBig')(FILE_MAX_MB);
          else S.err = t('aiErr')[r.error] || t('netErr');
        } catch (ex) { console.error('ws_up', ex); S.err = t('netErr'); }
        S.busy = false; aiRedraw();
      });
    }
  }

  const tk = k => T.ko[k];   // 올리기 화면과 같은 글(관리자 화면은 한국어만)
  let adm = null, admBusy = false, admErr = '', admPage = '', admTab = 'mat', admOpen = '', admNew = null, admF = 'all';
  const admQ = { mat: '', tc: '' };
  const admSt = m => m.deleted ? 'del' : (m.pub ? 'pub' : 'hid');
  const ghost = '<span class="circ ghost"></span>';

  function admErrView(ex) {
    const msg = String(ex && (ex.message || ex) || '').slice(0, 200) + ' · ' + navigator.userAgent.slice(0, 120);
    return barSub(AT.title, '#/mine', ghost) + `<div class="pad"><div class="emptycard" style="margin-top:18px"><div class="e">😢</div>${esc(AT.viewErr)}`
      + `<small style="overflow-wrap:anywhere">${esc(msg)}</small><a class="btn" href="#/mine">${esc(AT.toMine)}</a></div></div>`;
  }
  async function admLoad() {
    if (admBusy || !teacher) return;
    admBusy = true; admErr = '';
    try {
      const r = await api.post({ action: 'admin', op: 'overview', code: teacher.code });
      if (r.ok) adm = r; else if (!admFail(r)) admErr = AT.loadErr + (r.error ? ` (${r.error})` : '');
    } catch (e) { admErr = t('netErr') + ` (${String(e && e.name || e)})`; }
    admBusy = false;
    if (route()[0] === 'admin') render(true);
  }
  // 코드가 바뀌었거나 꺼졌으면 로그아웃, 관리자가 아니면 입구를 닫는다
  function admFail(r) {
    if (r.error === 'bad_code') { teacher = null; adm = null; saveTeacher(null); afterLogin = '#/admin'; location.hash = '#/login'; return true; }
    if (r.error === 'not_admin') { if (teacher) { teacher.admin = false; saveTeacher(teacher); } adm = null; render(true); return true; }
    return false;
  }
  // 관리자 동작 하나: 보내고 → 관리자 자료와 자료실을 새로 받고 → 다시 그린다(then은 다시 그리기 전에)
  async function admDo(op, body, okMsg, btn, then) {
    if (btn) btn.disabled = true;
    try {
      const r = await api.post(Object.assign({ action: 'admin', op, code: teacher.code }, body));
      if (r.ok) {
        if (then) then(r);
        await Promise.all([admRefresh(), reload().catch(() => {})]);
        if (okMsg) toast(okMsg);
        render(true);
        return r;
      }
      if (!admFail(r)) {
        toast(AT.err[r.error] || tk(r.error === 'too_many' ? 'tooMany' : 'netErr'));
        if (r.error === 'not_found') { await admRefresh(); render(true); }
      }
    } catch (e) { toast(t('netErr')); }
    if (btn && btn.isConnected) btn.disabled = false;
    return null;
  }
  async function admRefresh() { try { const r = await api.post({ action: 'admin', op: 'overview', code: teacher.code }); if (r.ok) adm = r; } catch (e) {} }

  function viewAdmin(tab) {
    if (!teacher) { afterLogin = location.hash; return viewLogin(); }
    if (!teacher.admin) return barSub(AT.title, '#/mine', ghost) + `<div class="pad"><div class="emptycard" style="margin-top:18px"><div class="e">🔒</div>${esc(AT.notAdmin)}<a class="btn" href="#/mine">${esc(AT.toMine)}</a></div></div>`;
    admTab = ADM_TABS.includes(tab) ? tab : 'mat';
    const rpOpen = adm ? (adm.reports || []).filter(x => !x.done).length : 0;
    const seg = `<nav class="mgseg" aria-label="${esc(AT.title)}">${ADM_TABS.map(k => `<a href="#/admin/${k}" class="${k === admTab ? 'on' : ''}"${k === admTab ? ' aria-current="page"' : ''}>${esc(AT.tabs[k])}${k === 'rp' && rpOpen ? ' ' + rpOpen : ''}</a>`).join('')}</nav>`;
    const body = !adm
      ? (admErr ? `<div class="emptycard" style="margin-top:14px"><div class="e">😢</div>${esc(admErr)}<button type="button" class="btn" data-aretry>${esc(tk('retry'))}</button></div>`
                : `<div class="loading" style="padding:80px 0"><span class="e">🐯</span>${esc(tk('loading'))}</div>`)
      : { mat: admMat, rp: admRp, cat: admCat, tc: admTc, set: admSet }[admTab]();
    return barSub(AT.title, '#/mine', ghost) + `<div class="pad"><div class="mgwrap">${seg}${body}</div></div>`;
  }
  const admSearch = (k, ph) => `<label class="srch">${ICON.search}<input id="mgQ" data-k="${k}" type="search" enterkeyhint="search" placeholder="${esc(ph)}" value="${esc(admQ[k])}" aria-label="${esc(ph)}">`
    + `<button type="button" class="sx" data-aqx="${k}" aria-label="${esc(tk('clearQ'))}"${admQ[k] ? '' : ' hidden'}>✕</button></label>`;
  // 찾는 글자를 칠 때는 목록만 다시 그린다(칸이 포커스를 잃지 않게)
  function drawAdmList() {
    const B = $('#mgList'); if (!B || !adm) return;
    B.innerHTML = admTab === 'tc' ? admTcList() : admMatList();
    const X = $('[data-aqx]'); if (X) X.hidden = !admQ[admTab === 'tc' ? 'tc' : 'mat'];
    bindAdmin();
  }

  // 신고: 최근 것부터. 처리한 신고는 흐리게 남는다
  function admRp() {
    const list = adm.reports || [];
    const rows = list.map(x => {
      const meta = [x.date, [x.topic, x.level, x.by].filter(Boolean).join(' · '), x.done && AT.rpDoneOn(x.done)].filter(Boolean).join(' · ');
      const btns = [x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(AT.rpOpen)}</a>` : '',
        x.pub ? `<button type="button" class="warn" data-aact="rp_hide" data-mid="${esc(x.materialId)}">${esc(AT.rpHide)}</button>` : '',
        x.done ? '' : `<button type="button" class="pri" data-aact="rp_done" data-rid="${x.id}">${esc(AT.rpDoneBtn)}</button>`].join('');
      return `<div class="apanel rpitem${x.done ? ' dim' : ''}"><h3>${esc(x.title || AT.rpGone)}</h3><p class="lhint">${esc(meta)}</p>`
        + `<p class="rpwhy"><b>${esc(T.ko.rpR[x.reason] || x.reason)}</b>${x.text ? '<br>' + esc(x.text) : ''}</p>${btns ? `<div class="abtns">${btns}</div>` : ''}</div>`;
    }).join('');
    return `<p class="lhint"><span class="m">i</span><span>${esc(AT.rpHint)}</span></p>` + (rows || `<div class="emptycard" style="margin-top:12px"><div class="e">📭</div>${esc(AT.rpNone)}</div>`);
  }

  // 자료: 전부(숨김·지운 것 포함), 최근 올린 것부터
  function admMat() {
    const n = k => k === 'all' ? adm.materials.length : adm.materials.filter(m => admSt(m) === k).length;
    const chips = `<div class="chips mchips">${['all', 'pub', 'hid', 'del'].map(k => `<button type="button" class="chip${admF === k ? ' on' : ''}" data-af="${k}" aria-pressed="${admF === k}">${esc(AT[k])} <small>${n(k)}</small></button>`).join('')}</div>`;
    return admSearch('mat', AT.matSearch) + chips + `<div id="mgList">${admMatList()}</div>`;
  }
  function admMatList() {
    const q = admQ.mat.replace(/\s+/g, '').toLowerCase();
    const list = adm.materials.slice().reverse().filter(m => (admF === 'all' || admSt(m) === admF)
      && (!q || [m.title, m.topic, m.by, m.school, m.url, m.desc, m.type, m.group].join(' ').replace(/\s+/g, '').toLowerCase().includes(q)));
    if (!list.length) return `<div class="emptycard" style="margin-top:12px"><div class="e">🔍</div>${esc(AT.none)}</div>`;
    return `<div class="acount">${esc(AT.count(list.length))}</div>` + list.map(admMatRow).join('');
  }
  function admMatRow(m) {
    const key = 'm:' + m.id, open = admOpen === key, s = admSt(m), [emo, bg] = TYPE_ICON[m.type] || TYPE_ICON['기타'];
    const badge = s === 'pub' ? '' : `<span class="badge ${s}">${esc(AT[s])}</span>`;
    const meta = [`${m.topic} · ${m.level}`, m.by, s === 'del' ? AT.del + ' ' + m.deleted : m.date].filter(Boolean).join(' · ');
    return `<div class="arow${open ? ' open' : ''}" data-row="${esc(key)}"><button type="button" class="ah" data-aopen="${esc(key)}" aria-expanded="${open}">`
      + `<span class="ti sm" style="background:${bg}">${emo}</span><span class="tx"><b>${esc(m.title)}</b><small>${esc(meta)}</small></span>${badge}</button>${open ? admMatForm(m) : ''}</div>`;
  }
  function comboField(cb, id, label, value, ph, hidden) {
    return `<div class="f cbx" data-cb="${cb}"${hidden ? ` id="${id}Field" hidden` : ''}><label class="lab" for="${id}">${label}</label><div class="inp"><input id="${id}" name="${cb}" value="${esc(value)}" placeholder="${esc(ph)}" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="${id}-l">`
      + `<button type="button" class="tog" tabindex="-1" aria-label="${esc(tk('cbOpen'))}">${ICON.down}</button></div><div class="cblist" id="${id}-l" role="listbox" hidden></div></div>`;
  }
  function admMatForm(m) {
    const s = admSt(m), types = !m.type || TYPES.includes(m.type) ? TYPES : TYPES.concat(m.type);
    return `<form class="aform" id="amForm" data-id="${esc(m.id)}" novalidate autocomplete="off">
      ${comboField('topic', 'am-topic', esc(tk('fTopic')), m.topic, tk('phTopic'))}
      ${comboField('group', 'am-group', `${esc(tk('fGroup'))} <small>${esc(tk('fGroupHint'))}</small>`, '', tk('phGroup'), true)}
      <div class="f"><span class="lab">${esc(tk('fLevel'))}</span><div class="seg3">${LEVEL_KEYS.map(k => `<label class="k-${k}"><input type="radio" name="level" value="${k}"${k === m.level ? ' checked' : ''}><span>${k}<small>${esc(levelDesc(k))}</small></span></label>`).join('')}</div></div>
      <div class="f"><label class="lab" for="am-title">${esc(tk('fTitle'))}</label><div class="inp"><input id="am-title" name="title" maxlength="60" value="${esc(m.title)}"></div></div>
      <div class="f"><span class="lab">${esc(tk('fType'))}</span><div class="tchips">${types.map(x => `<label><input type="radio" name="type" value="${esc(x)}"${x === m.type ? ' checked' : ''}><span>${(TYPE_ICON[x] || TYPE_ICON['기타'])[0]} ${esc(x)}</span></label>`).join('')}</div></div>
      <div class="f"><label class="lab" for="am-url">${esc(tk('fUrl'))}${m.file ? ` <small>${esc(AT.file)}</small>` : ''}</label><div class="inp"><input id="am-url" name="url" type="url" inputmode="url" value="${esc(m.url)}"${m.file ? ' readonly' : ''}></div>
        <p class="lhint" id="amUrlHint">${m.file ? linkHint({ lv: '', msg: AT.fileUrl }) : ''}</p><p class="lhint warn" id="amDup" hidden></p></div>
      <div class="f"><label class="lab" for="am-desc">${esc(tk('fDesc'))} <small>${esc(tk('optional'))}</small></label><div class="inp"><input id="am-desc" name="desc" maxlength="80" value="${esc(m.desc)}"></div></div>
      <div class="f"><label class="lab" for="am-descfr">${esc(tk('fDescFr'))} <small>${esc(tk('optional'))}</small></label><div class="inp"><input id="am-descfr" name="desc_fr" maxlength="120" value="${esc(m.desc_fr)}"></div></div>
      <p class="lhint"><span class="m">i</span><span>${esc(AT.owner(m.school, m.by, m.date))}</span></p>
      <p class="err" id="amErr"></p>
      <div class="abtns"><button type="submit" class="pri">${esc(AT.save)}</button>
        ${s === 'del' ? `<button type="button" data-aact="mat_restore">${esc(AT.restore)}</button>`
          : `<button type="button" data-aact="mat_pub">${esc(m.pub ? AT.hide : AT.show)}</button><button type="button" class="warn" data-aact="mat_del">${esc(AT.remove)}</button>`}
        <a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(AT.open)}</a></div></form>`;
  }

  // 분류: 첫 화면과 같은 차례(순서 칸 → 대주제는 처음 나온 차례). 표에 없는 소주제(자료에만 있음)는 대주제 끝에
  function admTree() {
    const list = adm.topics.map((x, i) => ({ name: x.topic, fr: x.fr, group: x.group || '기타', icon: x.icon, qid: Number(x.qid) || 0, k: Number(x.order) || (1000 + i), reg: true })).sort((a, b) => a.k - b.k);
    const live = adm.materials.filter(m => !m.deleted);
    live.forEach(m => { if (m.topic && !list.some(x => x.name === m.topic)) list.push({ name: m.topic, fr: '', group: m.group || '기타', icon: '', k: 1e9, reg: false }); });
    const groups = [];
    list.forEach(tp => {
      tp.n = live.filter(m => m.topic === tp.name).length;
      let g = groups.find(x => x.name === tp.group); if (!g) groups.push(g = { name: tp.group, topics: [] });
      g.topics.push(tp);
    });
    groups.forEach(g => g.topics.sort((a, b) => (b.reg - a.reg)));   // 표에 없는 소주제는 그 대주제 맨 끝(차례 바꾸기 대상 아님)
    return groups;
  }
  const groupItems = () => admTree().map(g => ({ v: g.name, label: g.name, sub: AT.nTopics(g.topics.length) }));
  function admGroupFr() { try { return JSON.parse(adm.settings.group_fr || '{}') || {}; } catch (e) { return {}; } }
  function admCat() {
    const groups = admTree(), regGroups = groups.filter(g => g.topics.some(x => x.reg));
    const add = admOpen === 't:+' ? `<div class="arow open" data-row="t:+">${admTopicForm(null)}</div>` : `<button type="button" class="mgnew" data-aopen="t:+">${ICON.plus}<span>${esc(AT.newTopic)}</span></button>`;
    return `<p class="lhint"><span class="m">i</span><span>${esc(AT.catHint)}</span></p>` + add + groups.map(g => {
      const gi = regGroups.indexOf(g), gkey = 'g:' + g.name, gOpen = admOpen === gkey;
      const mv = gi < 0 ? '' : `<button type="button" class="mv" data-amv="group" data-name="${esc(g.name)}" data-dir="-1" aria-label="${esc(g.name + ' ' + AT.up)}"${gi === 0 ? ' disabled' : ''}>${ICON.up}</button>`
        + `<button type="button" class="mv" data-amv="group" data-name="${esc(g.name)}" data-dir="1" aria-label="${esc(g.name + ' ' + AT.down)}"${gi === regGroups.length - 1 ? ' disabled' : ''}>${ICON.down}</button>`;
      const gfr = admGroupFr()[g.name] || '';
      const head = `<div class="ghd"><b>${esc(g.name)}${gfr ? ` <small>${esc(gfr)}</small>` : ''}</b><span class="gn">${esc(AT.nTopics(g.topics.length))}</span>${mv}<button type="button" class="mv txt" data-aopen="${esc(gkey)}" aria-expanded="${gOpen}">${esc(AT.rename)}</button></div>`;
      const gform = gOpen ? `<div class="arow open" data-row="${esc(gkey)}"><form class="aform" id="agForm" data-from="${esc(g.name)}" data-fr="${esc(gfr)}" novalidate autocomplete="off" style="border-top:0">
        <div class="f"><label class="lab" for="ag-to">${esc(AT.gName)}</label><div class="inp"><input id="ag-to" name="to" maxlength="40" value="${esc(g.name)}"></div></div>
        <div class="f"><label class="lab" for="ag-fr">${esc(AT.gFr)} <small>${esc(tk('optional'))}</small></label><div class="inp"><input id="ag-fr" name="fr" maxlength="40" value="${esc(gfr)}" placeholder="Rencontres"></div><p class="lhint">${esc(AT.gFrHint)}</p></div><p class="err" id="agErr"></p>
        <div class="abtns"><button type="submit" class="pri">${esc(AT.save)}</button><button type="button" data-aopen="${esc(gkey)}">${esc(AT.close)}</button></div></form></div>` : '';
      const nReg = g.topics.filter(x => x.reg).length;
      return head + gform + g.topics.map((tp, i) => admTopicRow(tp, i, nReg)).join('');
    }).join('');
  }
  function admTopicRow(tp, i, nReg) {
    const key = 't:' + tp.name, open = admOpen === key, ic = topicIcon(tp), pt = data.topics.find(x => x.name === tp.name);
    const mv = tp.reg ? `<button type="button" class="mv" data-amv="topic" data-name="${esc(tp.name)}" data-dir="-1" aria-label="${esc(tp.name + ' ' + AT.up)}"${i === 0 ? ' disabled' : ''}>${ICON.up}</button>`
      + `<button type="button" class="mv" data-amv="topic" data-name="${esc(tp.name)}" data-dir="1" aria-label="${esc(tp.name + ' ' + AT.down)}"${i >= nReg - 1 ? ' disabled' : ''}>${ICON.down}</button>` : '';
    return `<div class="arow${open ? ' open' : ''}" data-row="${esc(key)}"><div class="tline"><button type="button" class="ah" data-aopen="${esc(key)}" aria-expanded="${open}">`
      + `<span class="em sm${ic.txt ? ' txt' : ''}" style="background:${pt ? pt.color : '#F6EEE4'}">${esc(ic.v)}</span><span class="tx"><b>${esc(tp.name)}</b><small>${esc([tp.fr, AT.nMats(tp.n), tp.qid ? 'QR ' + tp.qid : ''].filter(Boolean).join(' · '))}</small></span>`
      + `${tp.reg ? '' : `<span class="badge hid">${esc(AT.missing)}</span>`}</button>${mv}</div>${open ? admTopicForm(tp) : ''}</div>`;
  }
  // 소주제 고치기(표에 있는 것) 또는 만들기(새 소주제 · 표에 없는 소주제 등록)
  function admTopicForm(tp) {
    const v = tp || { name: '', fr: '', group: '', icon: '', reg: false, n: 0 }, from = tp && tp.reg ? tp.name : '';
    return `<form class="aform" id="atForm" data-from="${esc(from)}" novalidate autocomplete="off"${tp ? '' : ' style="border-top:0"'}>
      <div class="f"><label class="lab" for="at-name">${esc(AT.tName)}</label><div class="inp"><input id="at-name" name="topic" maxlength="60" value="${esc(v.name)}" placeholder="${esc(tk('phTopic'))}"></div>
        <p class="lhint warn" id="atRen" hidden>${linkHint({ lv: 'warn', msg: AT.renameWarn })}</p></div>
      <div class="f"><label class="lab" for="at-fr">${esc(AT.tFr)} <small>${esc(tk('optional'))}</small></label><div class="inp"><input id="at-fr" name="fr" maxlength="60" value="${esc(v.fr)}" placeholder="Café"></div></div>
      ${comboField('group', 'at-group', esc(tk('fGroup')), v.group, tk('phGroup'))}
      <div class="f"><label class="lab" for="at-icon">${esc(AT.tIcon)} <small>${esc(tk('optional'))}</small></label><div class="inp"><input id="at-icon" name="icon" maxlength="16" value="${esc(v.icon)}" placeholder="${esc(AT.tIconPh)}"></div>
        <p class="lhint">${esc(AT.tIconHint)}</p></div>
      <p class="err" id="atErr"></p>
      <div class="abtns"><button type="submit" class="pri">${esc(from ? AT.save : AT.create)}</button>
        ${from && !v.n ? `<button type="button" class="warn" data-aact="topic_del" data-name="${esc(from)}">${esc(AT.remove)}</button>` : ''}
        ${tp ? `<a href="${topicHref(tp.name)}">${esc(AT.view)}</a>` : `<button type="button" data-aopen="t:+">${esc(AT.close)}</button>`}</div></form>`;
  }

  // 교사: 가입한 차례대로. 끄기·켜기, 새 로그인 코드(한 번만 보여 줌)
  function admTc() {
    const off = adm.teachers.filter(x => !x.active).length;
    return `<p class="lhint"><span class="m">i</span><span>${esc(AT.tcHint)}</span></p>` + admSearch('tc', AT.tcSearch)
      + `<div class="acount">${esc(AT.tcCount(adm.teachers.length, off))}</div><div id="mgList">${admTcList()}</div>`;
  }
  function admTcList() {
    const q = admQ.tc.replace(/\s+/g, '').toLowerCase();
    const list = adm.teachers.filter(x => !q || (x.name + x.school).replace(/\s+/g, '').toLowerCase().includes(q));
    return list.length ? list.map(admTcRow).join('') : `<div class="emptycard" style="margin-top:12px"><div class="e">🔍</div>${esc(AT.none)}</div>`;
  }
  function admTcRow(x) {
    const key = 'c:' + x.id, open = admOpen === key, me = x.id === adm.me;
    const badges = (x.admin ? `<span class="badge mgr">${esc(AT.admin)}</span>` : '') + (x.active ? '' : `<span class="badge off">${esc(AT.off)}</span>`);
    const meta = [String(x.school || '').replace(/\s*한글학교$/, ''), x.joined && AT.joinedOn(x.joined), AT.nMats(x.n)].filter(Boolean).join(' · ');
    const code = admNew && admNew.id === x.id ? `<div class="codebox"><p class="lab2">${esc(AT.codeFor(x.name))}</p><div class="newcode" id="newCode">${esc(admNew.code)}</div>`
      + `<button type="button" class="ghostbtn" data-acopy>${esc(tk('copyCode'))}</button><p class="keep">${esc(AT.codeKeep)}</p></div>` : '';
    const body = open ? `<div class="aform">${code}<div class="abtns">${me ? '' : `<button type="button" class="${x.active ? 'warn' : 'pri'}" data-aact="teacher_active" data-id="${x.id}">${esc(x.active ? AT.turnOff : AT.turnOn)}</button>`}`
      + `<button type="button" data-aact="teacher_code" data-id="${x.id}">${esc(AT.newCode)}</button>${me || x.admin ? '' : `<button type="button" class="warn" data-aact="teacher_del" data-id="${x.id}">${esc(AT.tcDel)}</button>`}</div>${me ? `<p class="lhint">${esc(AT.meHint)}</p>` : ''}</div>` : '';
    return `<div class="arow${open ? ' open' : ''}${x.active ? '' : ' dim'}" data-row="${esc(key)}"><button type="button" class="ah" data-aopen="${esc(key)}" aria-expanded="${open}">`
      + `<span class="av sm">👩‍🏫</span><span class="tx"><b>${esc(x.name)}</b><small>${esc(meta)}</small></span>${badges}</button>${body}</div>`;
  }

  // 설정: 가입 코드(보기·바꾸기·닫기) · 공지 · 한눈에
  function admSet() {
    const s = adm.settings, jc = s.join_code || '', ms = adm.materials, groups = admTree();
    const cnt = k => ms.filter(m => admSt(m) === k).length;
    const stats = [[cnt('pub'), AT.stat.pub], [cnt('hid'), AT.stat.hid], [cnt('del'), AT.stat.del], [groups.reduce((a, g) => a + g.topics.length, 0), AT.stat.topics],
      [groups.length, AT.stat.groups], [adm.teachers.length, AT.stat.tc]].map(([n, l]) => `<div><b>${n}</b><span>${esc(l)}</span></div>`).join('');
    return `<div class="apanel"><h3>${esc(AT.joinTitle)}</h3><p class="lhint">${esc(AT.joinHint)}</p>
        <div class="jcnow">${jc ? `<span>${esc(AT.joinNow)}</span><b>${esc(jc)}</b>` : `<b class="off">${esc(AT.joinClosed)}</b>`}</div>
        <form id="asJoin" novalidate autocomplete="off"><div class="f"><label class="lab" for="as-join">${esc(AT.joinNew)}</label><div class="inp"><input id="as-join" name="join" maxlength="40" autocapitalize="characters" spellcheck="false" placeholder="${esc(AT.joinPh)}"></div></div>
        <p class="err" id="asJoinErr"></p><div class="abtns"><button type="submit" class="pri">${esc(AT.joinSave)}</button>${jc ? `<button type="button" class="warn" data-aact="join_close">${esc(AT.joinCloseBtn)}</button>` : ''}</div></form></div>
      <div class="apanel"><h3>${esc(AT.noticeTitle)}</h3><p class="lhint">${esc(AT.noticeHint)}</p>
        <form id="asNotice" novalidate autocomplete="off"><textarea class="ta" name="notice" maxlength="300" placeholder="${esc(AT.noticePh)}" aria-label="${esc(AT.noticeTitle)}">${esc(s.notice || '')}</textarea>
        <div class="abtns"><button type="submit" class="pri">${esc(AT.save)}</button>${s.notice ? `<button type="button" data-aact="notice_clear">${esc(AT.noticeClear)}</button>` : ''}</div></form></div>
      <div class="apanel"><h3>${esc(AT.statTitle)}</h3><div class="astat">${stats}</div></div>
      <div class="apanel"><h3>${esc(AT.aiTitle)}</h3><p class="lhint">${esc(admAiLine())}</p></div>`;
  }
  // AI 도우미 이번 달 사용량. 금액은 Claude Opus 5.5 값(입력 100만 토큰 4달러, 출력 20달러)으로 어림한 것
  function admAiLine() {
    const a = adm.ai || {};
    if (!a.on) return AT.aiOffLine;
    return AT.aiMonth(a.n || 0, (((a.in || 0) * 4 + (a.out || 0) * 20) / 1e6).toFixed(2));
  }

  function bindAdmin() {
    if (!adm) return;
    const mf = $('#amForm'); if (mf && !mf.dataset.bound) bindAmForm(mf);
    const tf = $('#atForm'); if (tf && !tf.dataset.bound) bindAtForm(tf);
    const gf = $('#agForm'); if (gf && !gf.dataset.bound) {
      gf.dataset.bound = '1';
      gf.onsubmit = async e => {
        e.preventDefault(); const from = gf.dataset.from, to = gf.elements.to.value.replace(/\s+/g, ' ').trim(), fr = gf.elements.fr.value.replace(/\s+/g, ' ').trim();
        if (!to) { $('#agErr').textContent = AT.err.missing; return; }
        if (to === from && fr === gf.dataset.fr) { admOpen = ''; render(true); return; }
        if (to !== from && admTree().some(g => g.name === to) && !confirm(AT.mergeAsk(from, to))) return;
        await admDo('group_rename', { from, to, fr }, AT.saved, gf.querySelector('.pri'), () => { admOpen = ''; });
      };
    }
    const jf = $('#asJoin'); if (jf) jf.onsubmit = async e => {
      e.preventDefault(); const v = jf.elements.join.value.replace(/\s+/g, '').trim();
      if (!v) { $('#asJoinErr').textContent = AT.joinNeed; jf.elements.join.focus(); return; }
      if (!confirm(AT.joinAsk(v))) return;
      await admDo('settings_save', { settings: { join_code: v } }, AT.saved, jf.querySelector('.pri'));
    };
    const nf = $('#asNotice'); if (nf) nf.onsubmit = async e => {
      e.preventDefault(); const v = nf.elements.notice.value.trim();
      await admDo('settings_save', { settings: { notice: v } }, v ? AT.saved : AT.noticeCleared, nf.querySelector('.pri'));
    };
  }
  function bindAmForm(f) {
    f.dataset.bound = '1';
    const m = adm.materials.find(x => x.id === f.dataset.id); if (!m) return;
    const el = n => f.elements[n];
    f.querySelectorAll('.cbx').forEach(box => box.dataset.cb === 'topic'
      ? bindCombo(box, topicItems(), s => tk('cbNewTopic')(s))
      : bindCombo(box, groupItems(), s => tk('cbNewGroup')(s)));
    const sync = () => {
      const v = el('topic').value.trim();
      $('#am-groupField').hidden =!v || data.topics.some(x => x.name === v) || adm.topics.some(x => x.topic === v);
      if (!m.file) { const r = linkCheck(el('url').value), h = $('#amUrlHint'); h.className = 'lhint' + (r.lv ? ' ' + r.lv : ''); h.innerHTML = linkHint(r); }
      const d = dupOf(el('url').value, m.id, adm.materials), dh = $('#amDup');
      dh.hidden = !d; dh.innerHTML = d ? linkHint({ lv: 'warn', msg: tk('dupLink')(d.title, [d.topic + ' · ' + d.level, admSt(d) === 'pub' ? '' : AT[admSt(d)]].filter(Boolean).join(' · ')) }) : '';
    };
    f.addEventListener('input', sync); f.addEventListener('change', sync); sync();
    f.onsubmit = async e => {
      e.preventDefault(); const err = $('#amErr'); err.textContent = '';
      const topic = el('topic').value.trim(), kt = adm.topics.find(x => x.topic === topic);
      const material = { topic, group: kt ? kt.group : (el('group').value.trim() || '기타'), level: el('level').value, title: el('title').value.trim(),
        type: el('type').value, url: el('url').value.trim(), desc: el('desc').value.trim(), desc_fr: el('desc_fr').value.trim() };
      const miss = !topic ? 'needTopic' : !material.level ? 'needLevel' : !material.title ? 'needTitle' : !m.file && !material.url ? 'needUrl' : '';
      if (miss) { err.textContent = tk(miss); return; }
      if (!m.file) { const lk = linkCheck(material.url); if (lk.lv === 'bad') { err.textContent = lk.msg; return; } }
      await admDo('mat_save', { id: m.id, material }, AT.saved, f.querySelector('.pri'));
    };
  }
  function bindAtForm(f) {
    f.dataset.bound = '1';
    const from = f.dataset.from, el = n => f.elements[n];
    bindCombo(f.querySelector('.cbx'), groupItems(), s => tk('cbNewGroup')(s));
    const sync = () => { $('#atRen').hidden = !from || el('topic').value.trim() === from; };
    f.addEventListener('input', sync); sync();
    f.onsubmit = async e => {
      e.preventDefault(); const err = $('#atErr'); err.textContent = '';
      const body = { from, topic: el('topic').value.replace(/\s+/g, ' ').trim(), fr: el('fr').value.trim(), group: el('group').value.replace(/\s+/g, ' ').trim() || '기타', icon: el('icon').value.trim() };
      if (!body.topic) { err.textContent = tk('needTopic'); el('topic').focus(); return; }
      if (from && body.topic !== from && !confirm(AT.renameAsk(from, body.topic))) return;
      await admDo('topic_save', body, from ? AT.saved : AT.created, f.querySelector('.pri'), () => { admOpen = 't:' + body.topic; });
    };
  }
  // 관리자 화면 누르기(열고 닫기·걸러 보기·동작·차례 바꾸기·코드 복사). 받았으면 true
  function admClick(e) {
    if (e.target.closest('[data-aretry]')) { admErr = ''; admLoad(); render(true); return true; }
    const O = e.target.closest('[data-aopen]');
    if (O) {
      const k = O.dataset.aopen; admOpen = admOpen === k ? '' : k; admNew = null; render(true);
      const row = admOpen && [...document.querySelectorAll('[data-row]')].find(x => x.dataset.row === admOpen);
      if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      return true;
    }
    const F = e.target.closest('[data-af]'); if (F) { admF = F.dataset.af; admOpen = ''; render(true); return true; }
    const X = e.target.closest('[data-aqx]'); if (X) { admQ[X.dataset.aqx] = ''; const i = $('#mgQ'); if (i) { i.value = ''; i.focus(); } drawAdmList(); return true; }
    if (e.target.closest('[data-acopy]')) {
      const code = admNew && admNew.code; if (!code) return true;
      navigator.clipboard.writeText(code).then(() => toast(tk('codeCopied')), () => { const r = document.createRange(), s = getSelection(); r.selectNodeContents($('#newCode')); s.removeAllRanges(); s.addRange(r); toast(tk('copySel')); });
      return true;
    }
    const MV = e.target.closest('[data-amv]');
    if (MV) { admDo(MV.dataset.amv === 'group' ? 'group_move' : 'topic_move', { [MV.dataset.amv]: MV.dataset.name, dir: Number(MV.dataset.dir) }, '', MV); return true; }
    const A = e.target.closest('[data-aact]'); if (A) { e.preventDefault(); admAct(A); return true; }
    return false;
  }
  async function admAct(b) {
    const op = b.dataset.aact, f = b.closest('form'), m = f && f.id === 'amForm' ? adm.materials.find(x => x.id === f.dataset.id) : null;
    if (op === 'mat_pub' && m) return admDo('mat_pub', { id: m.id, on: !m.pub }, m.pub ? AT.hiddenT : AT.shownT, b);
    if (op === 'mat_del' && m) { if (confirm(AT.delAsk(m.title))) admDo('mat_del', { id: m.id }, AT.removed, b); return; }
    if (op === 'mat_restore' && m) return admDo('mat_restore', { id: m.id }, AT.restored, b);
    if (op === 'topic_del') { if (confirm(AT.topicDelAsk(b.dataset.name))) admDo('topic_del', { topic: b.dataset.name }, AT.topicDeleted, b, () => { admOpen = ''; }); return; }
    if (op === 'rp_hide') return admDo('mat_pub', { id: b.dataset.mid, on: false }, AT.hiddenT, b);
    if (op === 'rp_done') return admDo('report_done', { id: Number(b.dataset.rid) }, AT.rpDoneT, b);
    const x = b.dataset.id ? adm.teachers.find(y => y.id === Number(b.dataset.id)) : null;
    if (op === 'teacher_del' && x) { if (confirm(AT.tcDelAsk(x.name, x.n))) admDo('teacher_del', { id: x.id }, AT.tcDelDone, b, () => { admOpen = ''; }); return; }
    if (op === 'teacher_active' && x) { if (!x.active || confirm(AT.offAsk(x.name))) admDo('teacher_active', { id: x.id, on: !x.active }, x.active ? AT.offDone : AT.onDone, b); return; }
    if (op === 'teacher_code' && x) {
      const me = x.id === adm.me;
      if (!confirm(me ? AT.codeAskMe : AT.codeAsk(x.name))) return;
      return admDo('teacher_code', { id: x.id }, AT.codeMade, b, r => {
        admNew = { id: x.id, code: r.code };
        if (me) { teacher.code = r.code; saveTeacher(teacher); }   // 이 기기는 새 코드로 바로(다음 요청부터 새 코드)
      });
    }
    if (op === 'join_close') { if (confirm(AT.joinCloseAsk)) admDo('settings_save', { settings: { join_code: '' } }, AT.joinClosedT, b); return; }
    if (op === 'notice_clear') return admDo('settings_save', { settings: { notice: '' } }, AT.noticeCleared, b);
  }

  // 누르기는 한곳에서 받는다
  document.addEventListener('click', e => {
    const L = e.target.closest('[data-lang]'); if (L) { lang = L.dataset.lang; render(true); return; }
    const G = e.target.closest('[data-group]'); if (G) { groupFilter = G.dataset.group; render(true); return; }
    const V = e.target.closest('[data-level]'); if (V) { const p = route(), tq = p[0] === 'q' ? topicByQid(p[1]) : null; history.replaceState(null, '', topicHref(tq ? tq.name : (p[1] || ''), V.dataset.level)); render(true); return; }
    if (e.target.closest('[data-print]')) { window.print(); return; }
    if (e.target.closest('[data-logout]')) { teacher = null; adm = null; aiRecS = { ask: '', busy: false, res: null, err: '', left: null }; aiWsS = aiWsBlank(); saveTeacher(null); toast(t('logout')); if (location.hash === '#/') render(); else location.hash = '#/'; return; }
    const LV = e.target.closest('[data-leave]'); if (LV) { leaveAccount(LV); return; }
    if (admClick(e)) return;
    const D = e.target.closest('[data-del]'); if (D) { e.preventDefault(); delMat(D); return; }
    const MG = e.target.closest('[data-mg]'); if (MG) { mineGroup = MG.dataset.mg; render(true); return; }
    // 즐겨찾기: ☆ 담기·빼기, 필터(줄마다 하나, 다시 누르거나 '전체'면 풀림)·정렬 고르기, 초기화 / 자료실 찾는 글자 지우기 / 로그인 안내 → 로그인 뒤 즐겨찾기로
    const FV = e.target.closest('[data-fav]'); if (FV) { e.preventDefault(); toggleFav(FV); return; }
    const FK = e.target.closest('[data-fk]'); if (FK) {
      const k = FK.dataset.fk, v = FK.dataset.fv;
      favF[k] = !v || (favF[k].length === 1 && favF[k][0] === v) ? [] : [v];
      if (k === 'group' && favF.group.length) favF.topic = favF.topic.filter(tn => { const tp = data.topics.find(x => x.name === tn); return tp && favF.group.includes(tp.group); });
      render(true); return;
    }
    const FS = e.target.closest('[data-fsort]'); if (FS) { favSort = FS.dataset.fsort; render(true); return; }
    if (e.target.closest('[data-freset]')) { favF = { group: [], topic: [], level: [], type: [] }; favSort = 'added'; render(true); return; }
    if (e.target.closest('[data-libqx]')) { libQ = ''; const i = $('#libQ'); if (i) { i.value = ''; i.focus(); } drawLib(); return; }
    if (e.target.closest('[data-tofav]')) afterLogin = '#/fav';
  });
  document.addEventListener('input', e => {
    if (e.target && e.target.id === 'libQ') { libQ = e.target.value; drawLib(); }
    if (e.target && e.target.id === 'mgQ') { admQ[e.target.dataset.k] = e.target.value; drawAdmList(); }
  });

  let toastTimer;
  function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1900); }

  async function reload() { const raw = await api.load(); if (!raw || raw.ok === false) throw new Error(raw && raw.error || 'load'); prepare(raw); }
  async function boot() {
    loadError = false; $('#screen').innerHTML = `<div class="loading"><span class="e">🐯</span>${esc(t('loading'))}</div>`;
    try { await reload(); } catch (e) { loadError = true; }
    render();
    refreshTeacher();
  }
  // 로그인해 둔 기기: 즐겨찾기를 서버에서 다시 받아 맞춘다(다른 기기에서 담은 것도 보이게). 코드가 없어졌으면 로그아웃.
  async function refreshTeacher() {
    if (!teacher) return;
    try {
      const r = await api.post({ action: 'login', code: teacher.code });
      if (!teacher) return;
      if (r.ok) {
        teacher = Object.assign({}, teacher, { name: r.teacher.name, school: r.teacher.school, favs: Array.isArray(r.favs) ? r.favs : (teacher.favs || []), admin: !!r.admin,
          mine: Array.isArray(r.mine) ? r.mine : teacher.mine, terms: !!r.terms, ai: !!r.ai });
        saveTeacher(teacher);
        if (['t', 'q', 'fav', 'mine', 'admin', 'ai'].includes(route()[0] || '')) render(true);
      } else if (r.error === 'bad_code') { teacher = null; saveTeacher(null); render(true); }
    } catch (e) {}
  }
  window.addEventListener('hashchange', () => render());
  // 관리자 화면에서 난 오류는 알림 한 줄로도 보여 준다(폰에서 무엇이 막혔는지 알 수 있게)
  const admOops = m => { if ((route()[0] || '') === 'admin') toast('오류: ' + String(m || '').slice(0, 80)); };
  window.addEventListener('error', e => admOops(e.message));
  window.addEventListener('unhandledrejection', e => admOops(e.reason && (e.reason.message || e.reason)));
  // 홈 화면에 추가 안내는 뺐다(2026-11-13 휴먼쌤 "홈 화면에 추가하라는 이 안내는 그냥 삭제해줘").
  // 크롬이 스스로 띄우는 설치 알림도 뜨지 않게 막는다. 브라우저 메뉴의 '홈 화면에 추가'는 그대로 된다. 서비스 워커는 앱처럼 열리게 하는 최소한의 것(sw.js).
  window.addEventListener('beforeinstallprompt', e => e.preventDefault());
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  boot();
})();
</script>
</body>
</html>
