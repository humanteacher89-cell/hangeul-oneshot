<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EF">
<meta name="description" content="프랑스 한글학교 레벨별 자료">
<title>한글원샷</title>
<!-- 홈 화면에 추가하면 주소창 없이 앱처럼 열린다(manifest.json · sw.js · icons/) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/symbol.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한글원샷">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 한글원샷 — 모바일 앱 화면(시안 A안: 밝고 귀여운 학습 앱). 휴대폰 기준, PC에서는 폰 폭(480px) 화면을 가운데에 둔다. */
  :root {
    --ink: #2B2118; --sub: #8A7B6C; --line: #F0E4D4; --bg: #FFF8EF; --card: #fff;
    --coral: #FF6B4A; --coral-d: #E04E2E;
    --g: #22B573; --g-d: #169258; --g-l: #DCF5E8;
    --bl: #3D8BFD; --bl-d: #2367D3; --bl-l: #E0ECFF;
    --pu: #9B6BFF; --pu-d: #7647E6; --pu-l: #EDE5FF;
    --press: 0 4px 0 #EEDFCB;
    --tabh: 66px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: #EFE8DF; }
  body { margin: 0; color: var(--ink); line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
         font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  svg { display: block; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .app { position: relative; max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; background: var(--bg); overflow-x: hidden;
         padding-bottom: calc(var(--tabh) + 30px + env(safe-area-inset-bottom)); }
  .app.notab { padding-bottom: 0; }
  .app.notab .tabbar { display: none; }
  @media (min-width: 520px) { .app { box-shadow: 0 0 0 1px rgba(80,50,20,.05), 0 12px 48px rgba(80,50,20,.10); } }
  .pad { padding: 4px 20px 0; }

  /* 위 제목 줄 */
  .appbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: calc(10px + env(safe-area-inset-top)) 20px 10px; background: rgba(255,248,239,.92);
            -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px); }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 20px; font-weight: 900; letter-spacing: -.03em; min-width: 0; }
  .brand span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logo { flex: none; width: 34px; height: 34px; border-radius: 11px; background: var(--coral); display: grid; place-items: center; box-shadow: 0 3px 0 var(--coral-d); }
  .logo svg { width: 22px; height: 22px; }
  /* 로고(2026-10-25 휴먼쌤 "이 로고 파일도 반영해줘" · "hangul -> 이걸 hangeul로 수정"): 가로 로고 icons/logo-h.svg, 상징 icons/symbol.svg */
  .hlogo { display: block; height: 40px; width: auto; }
  .logo.sym { background: #fff; border: 2px solid var(--line); box-shadow: none; }
  .logo.sym img { display: block; height: 78%; width: auto; }
  .atitle { font-size: 18px; font-weight: 900; letter-spacing: -.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lang { flex: none; display: flex; background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 3px; }
  .lang button { border: 0; background: none; padding: 5px 11px; border-radius: 14px; font-size: 13px; font-weight: 800; color: var(--sub); }
  .lang.sm button { padding: 5px 9px; }
  .lang button.on { background: var(--ink); color: #fff; }
  .circ { flex: none; width: 42px; height: 42px; border-radius: 50%; background: #fff; border: 0; display: grid; place-items: center; box-shadow: 0 3px 0 rgba(43,33,24,.08); }
  .circ svg { width: 22px; height: 22px; }
  .circ.ghost { visibility: hidden; }

  /* 첫 화면 */
  .hero { position: relative; margin-top: 4px; background: linear-gradient(135deg, #FFB547 0%, #FF7A45 100%); border-radius: 26px; padding: 20px 20px 22px;
          color: #fff; box-shadow: 0 5px 0 #E3603A; overflow: hidden; }
  .hero:before { content: ""; position: absolute; right: -36px; top: -44px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.16); }
  .hero .hi { position: relative; margin: 0; font-size: 14px; font-weight: 800; opacity: .92; }
  .hero h1 { position: relative; margin: 5px 0 0; font-size: 25px; line-height: 1.3; font-weight: 900; letter-spacing: -.03em; max-width: calc(100% - 88px); }
  .hero .other { position: relative; margin: 9px 0 0; font-size: 13px; font-weight: 600; opacity: .88; max-width: calc(100% - 88px); }
  .hero .mascot { position: absolute; right: 14px; bottom: 10px; font-size: 76px; line-height: 1; transform: rotate(-7deg); }
  .notice { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; background: #fff; border: 2px solid var(--line); border-radius: 18px;
            padding: 11px 14px; font-size: 13.5px; font-weight: 700; color: #6E5E50; line-height: 1.45; }
  .notice .e { font-size: 18px; line-height: 1.2; }
  .chips { display: flex; gap: 8px; margin: 18px -20px 0; padding: 2px 20px 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 9px 16px; border-radius: 999px; background: #fff; border: 2px solid var(--line); font-size: 15px; font-weight: 800; color: #6E5E50; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .sec { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 11px; }
  .sec h2 { margin: 0; font-size: 19px; font-weight: 900; letter-spacing: -.02em; }
  .sec span { font-size: 13.5px; color: var(--sub); font-weight: 700; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tcard { display: block; min-width: 0; background: #fff; border: 2px solid var(--line); border-radius: 22px; padding: 14px 14px 13px; box-shadow: var(--press); transition: transform .08s, box-shadow .08s; }
  .tcard:active, a.item:active, .trow:active { transform: translateY(3px); box-shadow: 0 1px 0 #EEDFCB; }
  .em { flex: none; width: 50px; height: 50px; border-radius: 17px; display: grid; place-items: center; font-size: 29px; line-height: 1; }
  .em.txt, .bigem.txt { font-weight: 900; color: var(--coral-d); letter-spacing: -.04em; }
  .em.txt { font-size: 19px; }
  .tcard h3 { margin: 10px 0 0; font-size: 17px; font-weight: 900; letter-spacing: -.03em; line-height: 1.25; word-break: keep-all; }
  .tcard .fr { margin: 2px 0 0; font-size: 12px; color: var(--sub); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lv3 { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .lv3 b { font-size: 11.5px; font-weight: 900; padding: 3px 7px; border-radius: 8px; }
  .l-하 { background: var(--g-l); color: var(--g-d); } .l-중 { background: var(--bl-l); color: var(--bl-d); } .l-상 { background: var(--pu-l); color: var(--pu-d); }
  .l-z { background: #F4EEE6; color: #C2B4A4; }
  .install { display: flex; align-items: center; gap: 12px; margin-top: 16px; background: #fff; border: 2px solid var(--line); border-radius: 20px;
             padding: 11px 10px 11px 12px; box-shadow: var(--press); }
  .install .logo { width: 42px; height: 42px; border-radius: 13px; }
  .install .logo svg { width: 26px; height: 26px; }
  .install .tx { flex: 1; min-width: 0; }
  .install b { display: block; font-size: 14.5px; font-weight: 900; letter-spacing: -.02em; line-height: 1.35; }
  .install small { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 700; color: var(--sub); line-height: 1.45; }
  .install small svg { display: inline-block; width: 15px; height: 15px; vertical-align: -3px; color: var(--bl); }
  .inbtn { flex: none; border: 0; background: var(--coral); color: #fff; font-weight: 900; font-size: 14px; padding: 9px 14px; border-radius: 999px; box-shadow: 0 3px 0 var(--coral-d); }
  .inx { flex: none; align-self: flex-start; width: 28px; height: 28px; border: 0; border-radius: 50%; background: #F4EEE6; color: #8A7B6C; display: grid; place-items: center; }
  .inx svg { width: 13px; height: 13px; }
  .foot { margin: 24px 0 0; text-align: center; font-size: 12.5px; color: var(--sub); font-weight: 600; line-height: 1.7; }
  .mock { display: inline-block; margin-top: 6px; padding: 4px 10px; border-radius: 999px; background: #FFF1D6; color: #8A5A00; font-size: 12px; font-weight: 800; }

  /* 아래 탭 */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 480px; z-index: 30; display: flex; justify-content: space-around;
            background: #FFFDF9; border-top: 2px solid var(--line); box-shadow: 0 -6px 16px rgba(120,90,50,.06); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 84px; padding: 2px 0; font-size: 11.5px; font-weight: 800; color: #B6A796; }
  .tab svg { width: 27px; height: 27px; }
  .tab.on { color: var(--coral); }

  /* 주제 화면 */
  .thead { position: relative; background: var(--tc, #DCEEFF); border-radius: 0 0 30px 30px; padding: calc(12px + env(safe-area-inset-top)) 16px 64px; overflow: hidden; }
  .thead:after { content: ""; position: absolute; right: -40px; top: 60px; width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .tnav { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tnav .right { display: flex; align-items: center; gap: 8px; }
  .qrtoast { min-width: 0; display: flex; align-items: center; gap: 6px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 800; padding: 8px 13px;
             border-radius: 999px; white-space: nowrap; overflow: hidden; animation: pop .45s ease-out; }
  .qrtoast svg { flex: none; width: 15px; height: 15px; }
  @keyframes pop { from { transform: scale(.6); } 70% { transform: scale(1.06); } to { transform: scale(1); } }
  .ttl { position: relative; z-index: 2; display: flex; align-items: center; gap: 16px; margin-top: 22px; padding: 0 4px; }
  .bigem { flex: none; width: 92px; height: 92px; border-radius: 30px; background: #fff; display: grid; place-items: center; font-size: 54px; line-height: 1; box-shadow: 0 5px 0 rgba(43,33,24,.08); }
  .bigem.txt { font-size: 32px; }
  .ttl .tx { min-width: 0; }
  .ttl .grp { margin: 0; font-size: 13px; font-weight: 800; color: rgba(43,33,24,.5); }
  .ttl h1 { margin: 2px 0 0; font-size: 30px; font-weight: 900; letter-spacing: -.04em; line-height: 1.2; word-break: keep-all; }
  .ttl .frt { margin: 3px 0 0; font-size: 15px; font-weight: 700; color: rgba(43,33,24,.5); }
  .lvsel { position: relative; z-index: 3; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: -46px 16px 0; }
  .lvbtn { min-width: 0; width: 100%; background: #fff; border: 2px solid var(--line); border-radius: 19px; padding: 9px 4px; text-align: center; box-shadow: var(--press); }
  .lvbtn .k { font-size: 24px; font-weight: 900; line-height: 1.15; }
  .lvbtn .d { margin-top: 2px; font-size: 11px; font-weight: 800; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lvbtn .n { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 900; padding: 2px 8px; border-radius: 8px; background: #F4EEE6; color: #8A7B6C; }
  .lvbtn.k-하 .k { color: var(--g); } .lvbtn.k-중 .k { color: var(--bl); } .lvbtn.k-상 .k { color: var(--pu); }
  .lvbtn.on.k-하 { background: var(--g); border-color: var(--g); box-shadow: 0 4px 0 var(--g-d); }
  .lvbtn.on.k-중 { background: var(--bl); border-color: var(--bl); box-shadow: 0 4px 0 var(--bl-d); }
  .lvbtn.on.k-상 { background: var(--pu); border-color: var(--pu); box-shadow: 0 4px 0 var(--pu-d); }
  .lvbtn.on .k { color: #fff; } .lvbtn.on .d { color: rgba(255,255,255,.88); } .lvbtn.on .n { background: rgba(255,255,255,.25); color: #fff; }
  .lvbtn.zero:not(.on) { opacity: .5; }
  .list { padding: 22px 16px 0; }
  .list.withfab { padding-bottom: 64px; }
  .lhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin: 0 4px 10px; }
  .lhead b { font-size: 18px; font-weight: 900; }
  .lhead span { font-size: 13px; font-weight: 700; color: var(--sub); }
  .item { display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid var(--line); border-radius: 21px; padding: 12px; box-shadow: var(--press);
          margin-bottom: 12px; transition: transform .08s, box-shadow .08s; }
  .ti { flex: none; width: 54px; height: 54px; border-radius: 17px; display: grid; place-items: center; font-size: 28px; line-height: 1; }
  .item .tx { flex: 1; min-width: 0; }
  .item .tt { display: block; font-size: 16.5px; font-weight: 900; letter-spacing: -.03em; line-height: 1.3; word-break: keep-all; }
  .item .meta { display: block; margin-top: 3px; font-size: 12.5px; color: var(--sub); font-weight: 700; }
  .item .ds { display: block; margin-top: 3px; font-size: 13px; color: #6E5E50; font-weight: 600; }
  .go { flex: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; display: grid; place-items: center; background: var(--g); box-shadow: 0 3px 0 var(--g-d); }
  .go svg { width: 19px; height: 19px; }
  .go.k-중 { background: var(--bl); box-shadow: 0 3px 0 var(--bl-d); } .go.k-상 { background: var(--pu); box-shadow: 0 3px 0 var(--pu-d); }
  .emptycard { margin-bottom: 12px; background: #fff; border: 2px dashed var(--line); border-radius: 21px; padding: 26px 16px; text-align: center; color: var(--sub); font-weight: 800; font-size: 14.5px; }
  .emptycard .e { font-size: 36px; line-height: 1; margin-bottom: 8px; }
  .emptycard small { display: block; margin-top: 4px; font-size: 12.5px; font-weight: 600; }
  .emptycard .btn { margin-top: 14px; }
  .hand { display: flex; gap: 11px; align-items: center; margin-top: 2px; background: #FFF1D6; border: 2px dashed #F2C46F; border-radius: 19px; padding: 11px 14px;
          font-size: 14.5px; font-weight: 800; color: #8A5A00; }
  .hand .h { font-size: 28px; line-height: 1; }
  .hand small { display: block; margin-top: 2px; font-size: 12px; font-weight: 700; color: #B07A1A; }
  .tip { margin: 16px 0 0; text-align: center; font-size: 12.5px; color: var(--sub); font-weight: 600; }
  .fab { position: fixed; z-index: 25; bottom: calc(var(--tabh) + 20px + env(safe-area-inset-bottom)); right: max(16px, calc(50% - 240px + 16px));
         display: flex; align-items: center; gap: 6px; background: var(--coral); color: #fff; font-weight: 900; font-size: 15px; padding: 13px 18px; border-radius: 999px;
         box-shadow: 0 4px 0 var(--coral-d), 0 8px 20px rgba(224,78,46,.25); }
  .fab svg { width: 18px; height: 18px; }

  /* QR */
  .qrnote { display: flex; gap: 10px; margin-top: 4px; background: #FFF1D6; border: 2px dashed #F2C46F; border-radius: 18px; padding: 12px 14px; font-size: 13.5px;
            font-weight: 700; color: #8A5A00; line-height: 1.5; }
  .qrlist { display: grid; gap: 14px; margin-top: 14px; }
  .qrcard { background: #fff; border: 2px solid var(--line); border-radius: 24px; overflow: hidden; box-shadow: var(--press); text-align: center; }
  .qrcard .qh { padding: 12px 10px; color: #fff; background: var(--ink); font-weight: 900; font-size: 18px; }
  .qrcard .qh small { display: block; margin-top: 2px; font-weight: 700; font-size: 12.5px; opacity: .9; }
  .qrcard.k-하 .qh { background: var(--g); } .qrcard.k-중 .qh { background: var(--bl); } .qrcard.k-상 .qh { background: var(--pu); }
  .qrcard .qb { padding: 18px 12px 14px; }
  .qrcard .qr { display: flex; justify-content: center; }
  .qrcard .qr img, .qrcard .qr canvas { width: 200px !important; height: 200px !important; }
  .qrcard .scan { margin-top: 12px; font-weight: 900; font-size: 15px; }
  .qrcard .scan small { display: block; font-weight: 600; color: var(--sub); font-size: 12.5px; }
  .qrcard .url { margin-top: 8px; font-size: 10px; color: #B3A595; word-break: break-all; }
  .trow { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 10px 12px;
          box-shadow: var(--press); transition: transform .08s, box-shadow .08s; }
  .trow .em { width: 42px; height: 42px; border-radius: 14px; font-size: 23px; }
  .trow .em.txt { font-size: 16px; }
  .trow b { flex: 1; min-width: 0; font-size: 16px; font-weight: 900; }
  .trow svg { width: 18px; height: 18px; color: var(--sub); }
  .pbtn { flex: none; border: 0; background: var(--coral); color: #fff; font-weight: 900; font-size: 14px; padding: 9px 15px; border-radius: 999px; box-shadow: 0 3px 0 var(--coral-d); }

  /* 선생님 */
  .panel { margin-top: 8px; background: #fff; border: 2px solid var(--line); border-radius: 26px; padding: 26px 20px 22px; box-shadow: var(--press); text-align: center; }
  .bigav { width: 84px; height: 84px; margin: 0 auto; border-radius: 28px; background: #FFE6D3; display: grid; place-items: center; font-size: 46px; line-height: 1; }
  .panel h1 { margin: 14px 0 6px; font-size: 23px; font-weight: 900; letter-spacing: -.03em; }
  .panel .hint { margin: 0; font-size: 13.5px; color: var(--sub); font-weight: 600; line-height: 1.5; }
  .codein { display: block; width: 100%; height: 60px; margin: 18px 0 0; border: 2px solid var(--line); border-radius: 18px; background: #FFFCF7; text-align: center;
            font-size: 24px; font-weight: 900; letter-spacing: .3em; outline: none; }
  .codein::placeholder { letter-spacing: 0; color: #C9BBAB; font-size: 18px; }
  .codein:focus { border-color: var(--coral); box-shadow: 0 0 0 4px #FFE0D5; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 58px; margin-top: 16px; border: 0; border-radius: 19px;
         background: var(--coral); color: #fff; font-size: 18px; font-weight: 900; box-shadow: 0 5px 0 var(--coral-d); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--coral-d); }
  .btn:disabled { opacity: .6; }
  .btn svg { width: 20px; height: 20px; }
  .err { min-height: 1em; margin: 10px 0 0; color: #D93A1E; font-size: 13.5px; font-weight: 800; }
  .mockcodes { margin: 14px 0 0; padding: 8px 10px; border-radius: 12px; background: #FFF1D6; color: #8A5A00; font-size: 12.5px; font-weight: 800; }
  /* 가입(#/join) */
  .joinrow { margin: 16px 0 0; font-size: 14px; font-weight: 700; color: var(--sub); }
  .joinrow a { color: var(--coral-d); font-weight: 900; text-decoration: underline; text-underline-offset: 3px; }
  .joinp { text-align: left; }
  .joinp > h1, .joinp > .hint { text-align: center; }
  .privacy { margin: 18px 0 0; padding: 11px 12px; border-radius: 14px; background: #FFF6EA; color: #6E5E50; font-size: 12.5px; font-weight: 700; line-height: 1.55; }
  .agree { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 14.5px; font-weight: 800; }
  .agree input { flex: none; width: 22px; height: 22px; accent-color: var(--coral); }
  .lab2 { margin: 18px 0 0; font-size: 13.5px; font-weight: 900; color: #6E5E50; }
  .newcode { margin: 6px 0 12px; font-size: 36px; font-weight: 900; letter-spacing: .12em; user-select: all; }
  .keep { margin: 14px 0 0; font-size: 13px; font-weight: 700; color: #A86A00; line-height: 1.5; }
  .me { display: flex; align-items: center; gap: 12px; margin-top: 4px; background: #fff; border: 2px solid var(--line); border-radius: 22px; padding: 14px; box-shadow: var(--press); }

  .qrbtn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: #fff; color: var(--ink); display: grid; place-items: center; padding: 0; }

  /* 자료 올리기(아래에서 올라온 창 모양) */
  .updim { display: block; height: calc(64px + env(safe-area-inset-top)); background: linear-gradient(rgba(36,24,14,.40), rgba(36,24,14,.46)), var(--tc, #FFE6D3); }

  .xbtn svg { width: 18px; height: 18px; }

         font-size: 13.5px; font-weight: 800; }

  .inp { display: flex; align-items: center; gap: 8px; min-height: 52px; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 0 6px 0 14px; }

  .inp input { flex: 1; min-width: 0; border: 0; outline: none; background: none; padding: 13px 0; font-size: 16px; font-weight: 800; }

  /* 고르기 목록(주제·묶음): 브라우저 기본 목록(datalist) 대신 앱 모양. 적으면 걸러지고, 딱 맞는 게 없으면 '새로 쓰기' 줄 */
  .cbx { position: relative; }
  .cbx .tog { flex: none; width: 36px; height: 36px; border: 0; border-radius: 10px; background: none; color: var(--sub); display: grid; place-items: center; padding: 0; }
  .cbx .tog svg { width: 18px; height: 18px; transition: transform .15s; }

  .cblist { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 6px); max-height: min(320px, 46vh); overflow-y: auto; overscroll-behavior: contain;
            background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 6px; box-shadow: 0 14px 30px rgba(80,55,30,.18); }
  .cblist .gh { padding: 9px 10px 4px; font-size: 12px; font-weight: 900; color: var(--sub); }
  .cbo { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; border-radius: 12px; padding: 8px 10px; text-align: left;
         font: inherit; font-size: 15.5px; font-weight: 800; color: var(--ink); }
  .cbo .em { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-size: 17px; line-height: 1; }

  /* 즐겨찾기(☆ 단추·#/fav 화면·필터 창·로그인 안내창) */
  .hbtns { display: flex; align-items: center; gap: 8px; }
  .star { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: #fff; color: #C9B9A6; display: grid; place-items: center; padding: 0; }
  .star svg { width: 20px; height: 20px; }
  .star.on { border-color: #FFE2A6; background: #FFF6E0; color: #FFB020; }
  .star.on svg { fill: #FFB020; }
  .qrpill { flex: none; display: flex; align-items: center; gap: 5px; height: 40px; padding: 0 13px; border-radius: 999px; background: var(--coral); color: #fff; font-size: 14px; font-weight: 900; box-shadow: 0 3px 0 var(--coral-d); }
  .qrpill svg { width: 18px; height: 18px; }
  .item.fav { gap: 8px; }
  .item.fav > a:first-child { gap: 10px; }
  .favtop { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .favtop .cnt { font-size: 13.5px; font-weight: 800; color: var(--sub); white-space: nowrap; }
  .srch { display: flex; align-items: center; gap: 10px; height: 52px; margin-top: 4px; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 0 8px 0 14px; color: var(--sub); }
  .srch:focus-within { border-color: var(--coral); box-shadow: 0 0 0 4px #FFE0D5; }
  .srch > svg { flex: none; width: 20px; height: 20px; }
  .srch input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 16px; font-weight: 800; color: var(--ink); -webkit-appearance: none; appearance: none; }
  .srch input::placeholder { color: #BFAF9E; font-weight: 700; }
  .srch input::-webkit-search-cancel-button { display: none; }
  .srch.lib { margin: 14px 0 2px; }
  .srch .sx { flex: none; width: 28px; height: 28px; border: 0; border-radius: 50%; background: #F1E7DA; color: #8A7B6C; font-size: 13px; font-weight: 900; display: grid; place-items: center; padding: 0; }
  /* 즐겨찾기 필터: 팝업 없이 화면 안에서 바로 누른다(2026-10-25 휴먼쌤). 줄마다 이름 + 칩(폰은 옆으로 밀기, PC는 줄바꿈) */
  .fpanel { margin-top: 8px; background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 4px 0; }
  .frow { display: flex; align-items: center; gap: 8px; padding: 6px 0 6px 14px; }
  .frow + .frow { border-top: 1px dashed var(--line); }
  .frow .fl { flex: none; min-width: 46px; max-width: 86px; font-size: 13px; font-weight: 900; color: var(--sub); line-height: 1.2; }
  .fopts { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 1px 14px 1px 0; }
  .fopts::-webkit-scrollbar { display: none; }
  .fo { flex: none; padding: 6px 12px; border: 0; border-radius: 999px; background: #F6EFE6; font-size: 13.5px; font-weight: 800; color: #6E5E50; white-space: nowrap; }
  .fo.on { background: var(--ink); color: #fff; }
  .fo.k-하.on { background: var(--g); } .fo.k-중.on { background: var(--bl); } .fo.k-상.on { background: var(--pu); }
  .fo.srt.on { background: var(--bl); }
  .rhead { display: flex; justify-content: space-between; align-items: center; margin: 14px 2px 10px; }
  .rhead b { font-size: 17px; font-weight: 900; }
  .rhead button { border: 0; background: none; padding: 4px 2px; font-size: 13.5px; font-weight: 800; color: var(--coral-d); }
  .fdim { position: fixed; inset: 0; z-index: 45; background: rgba(36,24,14,.42); }
  .gbtn { height: 54px; border-radius: 18px; border: 2px solid var(--line); background: #fff; font-size: 16px; font-weight: 900; color: #6E5E50; }
  .favghost { opacity: .35; }
  .favghost i { display: block; height: 76px; border-radius: 21px; background: #fff; border: 2px solid var(--line); margin-bottom: 12px; }
  .fmodal { position: fixed; z-index: 46; left: 50%; top: 46%; transform: translate(-50%, -50%); width: calc(100% - 48px); max-width: 400px; background: #fff; border-radius: 28px;
            padding: 28px 22px 20px; text-align: center; box-shadow: 0 20px 50px rgba(40,25,10,.28); }
  .fmodal .e { width: 84px; height: 84px; margin: 0 auto; border-radius: 26px; background: #FFF6E0; display: grid; place-items: center; font-size: 46px; line-height: 1; }
  .fmodal h2 { margin: 14px 0 0; font-size: 23px; font-weight: 900; letter-spacing: -.03em; }
  .fmodal p { margin: 8px 0 0; font-size: 14.5px; font-weight: 700; color: var(--sub); line-height: 1.55; word-break: keep-all; }
  .fmodal .btn { margin-top: 18px; }
  .fmodal .later { display: inline-block; margin-top: 12px; font-size: 14px; font-weight: 800; color: var(--sub); }
  .app.dimtab .tabbar { z-index: 47; }
  .lhint { display: flex; gap: 7px; align-items: flex-start; margin: 8px 2px 0; font-size: 12.5px; font-weight: 700; color: var(--sub); line-height: 1.45; }
  .lhint .m { flex: none; width: 17px; height: 17px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; background: #C9BBAB; color: #fff;
              font-size: 11px; font-weight: 900; line-height: 1; }
  .lhint.ok { color: var(--g-d); } .lhint.ok .m { background: var(--g); }
  .lhint.warn { color: #A86A00; } .lhint.warn .m { background: #E9A23B; }
  .lhint.bad { color: #D93A1E; } .lhint.bad .m { background: #D93A1E; }
  /* 자료 넣는 방법: 파일 올리기(휴먼쌤 드라이브에 보관) / 링크 */
  .srcseg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; background: #F4EEE6; border-radius: 16px; padding: 4px; }
  .srcseg button { border: 0; background: none; border-radius: 12px; padding: 10px 4px; font-size: 14.5px; font-weight: 900; color: var(--sub); }
  .srcseg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 0 #E6D7C3; }
  .filebox { position: relative; display: flex; align-items: center; gap: 12px; min-height: 64px; background: #fff; border: 2px dashed #E1CFB8; border-radius: 16px; padding: 10px 14px; cursor: pointer; }
  .filebox:focus-within { border-color: var(--coral); box-shadow: 0 0 0 4px #FFE0D5; }
  .filebox input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .filebox .fi { flex: none; width: 40px; height: 40px; border-radius: 13px; background: #FFEDE6; color: var(--coral); display: grid; place-items: center; }
  .filebox .fi svg { width: 21px; height: 21px; }
  .filebox .fn { flex: 1; min-width: 0; font-size: 15px; font-weight: 800; overflow-wrap: anywhere; }
  .filebox .fn small { display: block; margin-top: 2px; font-size: 12px; font-weight: 700; color: var(--sub); }
  .filebox.has { border-style: solid; border-color: var(--g); }
  .filebox.has .fi { background: var(--g-l); color: var(--g-d); }
  .seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg3 label, .tchips label { position: relative; }
  .seg3 input, .tchips input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  .seg3 span { display: grid; place-items: center; align-content: center; height: 56px; border-radius: 15px; background: #fff; border: 2px solid var(--line); box-shadow: 0 3px 0 #EEDFCB;
               font-size: 19px; font-weight: 900; line-height: 1.1; text-align: center; }
  .seg3 span small { display: block; font-size: 10.5px; font-weight: 800; color: var(--sub); }
  .seg3 .k-하 span { color: var(--g); } .seg3 .k-중 span { color: var(--bl); } .seg3 .k-상 span { color: var(--pu); }
  .seg3 .k-하 input:checked + span { background: var(--g); border-color: var(--g); box-shadow: 0 3px 0 var(--g-d); color: #fff; }
  .seg3 .k-중 input:checked + span { background: var(--bl); border-color: var(--bl); box-shadow: 0 3px 0 var(--bl-d); color: #fff; }
  .seg3 .k-상 input:checked + span { background: var(--pu); border-color: var(--pu); box-shadow: 0 3px 0 var(--pu-d); color: #fff; }
  .seg3 input:checked + span small { color: rgba(255,255,255,.88); }
  .seg3 input:focus-visible + span, .tchips input:focus-visible + span { outline: 3px solid #FFC2B1; outline-offset: 2px; }
  .tchips { display: flex; flex-wrap: wrap; gap: 7px; }
  .tchips span { display: inline-block; padding: 8px 12px; border-radius: 999px; background: #fff; border: 2px solid var(--line); font-size: 14px; font-weight: 800; color: #5E4F42; }
  .tchips input:checked + span { background: var(--ink); color: #fff; border-color: var(--ink); }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 50px; height: 50px; border-radius: 16px; border: 2px solid var(--line); background: #fff; font-size: 22px; font-weight: 900; box-shadow: 0 3px 0 #EEDFCB; }
  .stepper .sv { display: flex; align-items: center; gap: 2px; height: 50px; padding: 0 14px; background: #fff; border: 2px solid var(--line); border-radius: 16px; }
  .stepper input { width: 46px; border: 0; outline: none; background: none; text-align: center; font-size: 19px; font-weight: 900; }
  .stepper span { font-weight: 800; color: var(--sub); }
  .cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0 auto; max-width: 480px; padding: 16px 20px calc(14px + env(safe-area-inset-bottom));
         background: linear-gradient(rgba(255,248,239,0), var(--bg) 30%); }
  .cta .btn { margin-top: 0; }

  .app.notab ~ .toast { bottom: calc(100px + env(safe-area-inset-bottom)); }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + 86px + env(safe-area-inset-bottom)); z-index: 40; transform: translate(-50%, 10px); max-width: calc(100% - 40px);
           background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 800; opacity: 0; transition: opacity .2s, transform .2s;
           pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .loading { padding: 140px 0; text-align: center; color: var(--sub); font-weight: 800; }
  .loading .e { display: block; margin-bottom: 10px; font-size: 46px; animation: bob .8s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-8px); } }

  /* PC·넓은 화면(900px 이상): 같은 주소, 넓은 배치. 휴대폰 화면은 위 규칙 그대로. 인쇄에는 쓰지 않는다(screen만) */
  @media screen and (min-width: 900px) {
    .app { max-width: 1200px; padding: 0 0 48px 232px; }
    .app.notab { padding-left: 0; }
    .pad { padding: 4px 32px 0; }
    .appbar { padding: 16px 32px 12px; }
    /* 아래 탭 → 왼쪽 메뉴 */
    .tabbar { top: 0; bottom: 0; left: max(0px, calc(50% - 600px)); right: auto; width: 220px; max-width: none; margin: 0; flex-direction: column; justify-content: flex-start;
              gap: 6px; padding: 24px 14px; border-top: 0; border-right: 2px solid var(--line); box-shadow: none; }
    .tabbar:before { content: ""; display: block; height: 46px; margin: 4px 12px 20px; background: url(icons/logo-h.svg) no-repeat left center / contain; }
    .appbar .brand { visibility: hidden; }   /* 로고는 왼쪽 메뉴 위에 한 번만 */
    .tab { flex-direction: row; gap: 12px; width: auto; padding: 12px 14px; border-radius: 16px; font-size: 16px; color: var(--sub); }
    .tab svg { width: 24px; height: 24px; }
    .tab:hover { background: #F6EEE3; }
    .tab.on { background: #FFEDE6; color: var(--coral-d); }
    /* 첫 화면 */
    .hero { padding: 28px 32px 30px; }
    .hero h1 { font-size: 32px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
    .chips { margin: 18px 0 0; padding: 2px 0 6px; flex-wrap: wrap; overflow: visible; }
    /* 주제 화면: 왼쪽 하·중·상, 오른쪽 자료 */
    .tview { display: grid; grid-template-columns: 300px 1fr; column-gap: 28px; padding: 0 32px; }
    .tview .thead { grid-column: 1 / -1; margin-top: 16px; border-radius: 30px; padding: 16px 24px 32px; }
    .tview .lvsel { grid-column: 1; align-self: start; position: sticky; top: 16px; margin: 24px 0 0; grid-template-columns: 1fr; gap: 10px; }
    .tview .lvbtn { display: grid; grid-template-columns: 54px 1fr auto; align-items: center; text-align: left; padding: 14px 16px; }
    .tview .lvbtn .k { font-size: 30px; }
    .tview .lvbtn .d { margin: 0; font-size: 13.5px; }
    .tview .lvbtn .n { margin: 0; }
    .tview .list { grid-column: 2; padding: 24px 0 0; }
    .tview .list .item { margin-bottom: 14px; }
    .fab { right: max(32px, calc(50% - 600px + 32px)); bottom: 32px; }
    /* QR: 주제·레벨 QR 두 줄 */
    .qrlist { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .mqr .qrlist { grid-template-columns: minmax(0, 420px); justify-content: center; }
    .qrnote { max-width: 760px; }
    /* 선생님 */
    #loginForm, #joinForm, .joined { max-width: 460px; margin-left: auto; margin-right: auto; }
    .panel + .tip { max-width: 460px; margin-left: auto; margin-right: auto; }
    /* 로그인 뒤 화면: 이름 카드·올리기 단추·내가 올린 자료를 같은 폭 한 줄기로 가운데에(2026-10-25 휴먼쌤 "좌우 폭이 안맞고 '내가올린자료'는 불필요하게 너무 좌우로 길어") */
    .minewrap { max-width: 680px; margin: 0 auto; }
    /* 자료 올리기: 왼쪽 칸들, 오른쪽 미리 보기 */
    .updim { display: none; }
    .sheet { max-width: 1000px; margin: 24px auto 40px; min-height: 0; border-radius: 30px; padding: 24px 32px 32px; display: grid; grid-template-columns: minmax(0, 1fr) 340px;
             column-gap: 32px; align-items: start; box-shadow: 0 0 0 2px var(--line); }
    .sheet > * { grid-column: 1; }
    .sheet .handle { display: none; }
    .sheet .pvf { grid-column: 2; grid-row: 1 / span 20; position: sticky; top: 24px; margin-top: 0; }
    .sheet .cta { position: static; padding: 0; background: none; margin: 20px 0 0; max-width: none; }
    .toast { bottom: 32px; }
  }

  @media print {
    html, body, .app { background: #fff !important; box-shadow: none !important; max-width: none !important; padding: 0 !important; }
    .appbar, .tabbar, .noprint, .toast, .fab { display: none !important; }
    .pad { padding: 0; }

  };

  let lang = 'ko';
  let data = { settings: {}, topics: [], groups: [], materials: [], updatedAt: '' };
  let teacher = loadTeacher();
  let loadError = false;
  let groupFilter = '';
  let firstRender = true;
  let afterLogin = '';
  let joined = null;         // 방금 가입한 결과(로그인 코드를 한 번 크게 보여 주려고. 가입 화면을 떠나면 잊는다)
  let installEvt = null;     // 안드로이드 크롬이 주는 '앱 설치' 기회
  let installHide = false;   // 홈 화면 추가 안내를 닫았는지(이번에 열어 둔 동안만)
  let upSrc = 'link';        // 올리기 화면: 'link'(링크, 왼쪽·처음) 또는 'file'(파일 PDF/이미지, 오른쪽) — 2026-10-24 휴먼쌤
  // 즐겨찾기 화면 상태(이번에 열어 둔 동안만): 찾는 글자, 필터(묶음·주제·레벨·유형 여러 개), 정렬, 필터 창 열림
  let libQ = '', favF ={ group: [], topic: [], level: [], type: [] }, favSort = 'added';

  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const t = k => T[lang][k];
  const levelInfo = k => LEVELS.find(l => l.key === k) || { key: k, ko: '', fr: '' };
  const levelDesc = k => { const l = levelInfo(k); return lang === 'fr' ? (l.fr || l.ko) : l.ko; };
  const levelDescOther = k => { const l = levelInfo(k); return lang === 'fr' ? l.ko : l.fr; };

  // ---------- 자료 정리 ----------
  function normLevel(s) {
    s = String(s || '').trim();
    if (/^(하|하급|초급|기초|입문|1|débutant)/i.test(s)) return '하';
    if (/^(중|중급|2|interm)/i.test(s)) return '중';
    if (/^(상|상급|고급|3|avanc)/i.test(s)) return '상';
    return LEVEL_KEYS.includes(s) ? s : '';
  }
  function normMaterial(m, i) {
    return {
      id: String(m.id || ('r' + i)), group: String(m.group || '').trim() || '기타', topic: String(m.topic || '').trim(),
      level: normLevel(m.level), title: String(m.title || '').trim(), type: String(m.type || '기타').trim() || '기타',
      url: String(m.url || '').trim(), desc: String(m.desc || '').trim(), minutes: Number(m.minutes) || 0,
      school: String(m.school || '').trim(), by: String(m.by || '').trim(), date: String(m.date || '').trim(),
      pub: !(String(m.pub || '').trim().toUpperCase() === 'N')
    };
  }
  function prepare(raw) {
    const mats = (raw.materials || []).map(normMaterial).filter(m => m.pub && m.title && m.topic && m.level && m.url);
    const meta = {};
    (raw.topics || []).forEach((tp, i) => {
      const n = String(tp.topic || '').trim();
      if (n) meta[n] = { fr: String(tp.fr || '').trim(), group: String(tp.group || '').trim(), order: Number(tp.order) || (1000 + i), icon: String(tp.icon || '').trim() };
    });
    // 주제 목록: 주제 탭 순서 → 자료에 처음 나온 순서
    const seen = new Map();
    Object.keys(meta).forEach(n => seen.set(n, { name: n, fr: meta[n].fr, group: meta[n].group, order: meta[n].order, icon: meta[n].icon, counts: {} }));
    mats.forEach((m, i) => {
      if (!seen.has(m.topic)) seen.set(m.topic, { name: m.topic, fr: '', group: m.group, order: 5000 + i, icon: '', counts: {} });
      const tp = seen.get(m.topic); if (!tp.group) tp.group = m.group; tp.counts[m.level] = (tp.counts[m.level] || 0) + 1;
    });
    const topics = [...seen.values()].sort((a, b) => a.order - b.order);
    topics.forEach((tp, i) => { if (!tp.group) tp.group = '기타'; tp.color = PASTELS[i % PASTELS.length]; });
    const groups = [];
    topics.forEach(tp => { let g = groups.find(x => x.name === tp.group); if (!g) { g = { name: tp.group, topics: [] }; groups.push(g); } g.topics.push(tp); });
    data = { settings: raw.settings || {}, topics, groups, materials: mats, updatedAt: raw.updatedAt || '' };
  }

  // ---------- 서버(앱스 스크립트) 또는 시험 모드 ----------
  const api = {
    async load() {
      if (MOCK) return mockData();
      const r = await fetch(CFG.API_URL + '?action=data&t=' + Date.now(), { redirect: 'follow' });
      return r.json();
    },
    async post(body) {
      if (MOCK) return mockPost(body);
      const r = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' });
      return r.json();
    }
  };
  function mockStore() { try { return JSON.parse(localStorage.getItem('oneshot.mock') || '{"uploads":[],"hidden":[],"teachers":[]}'); } catch (e) { return { uploads: [], hidden: [], teachers: [] }; } }
  function mockSave(s) { try { localStorage.setItem('oneshot.mock', JSON.stringify(s)); } catch (e) {} }
  function mockData() {
    const s = mockStore();
    const materials = [...SAMPLE.materials, ...s.uploads].filter(m => !s.hidden.includes(m.id));
    return Promise.resolve({ ok: true, settings: SAMPLE.settings, topics: SAMPLE.topics, materials, updatedAt: new Date().toISOString() });
  }
  function mockPost(b) {
    const s = mockStore();
    const teachers = [...(SAMPLE.teachers || []), ...(s.teachers || [])];
    if (b.action === 'join') {   // 시험 모드 가입: 가입 코드는 sample-data.js joinCode, 만든 교사는 이 기기에만 남는다
      if (String(b.joinCode || '').replace(/\s+/g, '').toUpperCase() !== String(SAMPLE.joinCode || '').toUpperCase()) return Promise.resolve({ ok: false, error: 'bad_join' });
      const name = String(b.name || '').replace(/\s+/g, ' ').trim(), key = x => String(x).replace(/\s+/g, '').toLowerCase();
      if (teachers.some(x => key(x.name) === key(name))) return Promise.resolve({ ok: false, error: 'dup_name' });
      const code = String(10000000 + Math.floor(Math.random() * 90000000));
      s.teachers = [...(s.teachers || []), { code, name, school: b.school }]; mockSave(s);
      return Promise.resolve({ ok: true, teacher: { name, school: b.school }, code });
    }
    const tc = teachers.find(x => x.code === String(b.code || ''));
    const favs = Object.assign({}, s.favs);   // 시험 모드 즐겨찾기: 이 기기에만(교사 코드별)
    if (b.action === 'login') return Promise.resolve(tc ? { ok: true, teacher: { name: tc.name, school: tc.school }, favs: favs[tc.code] || [] } : { ok: false, error: 'bad_code' });
    if (!tc) return Promise.resolve({ ok: false, error: 'bad_code' });
    if (b.action === 'fav') {
      const list = (favs[tc.code] || []).filter(x => x !== String(b.id)); if (b.on) list.unshift(String(b.id));
      favs[tc.code] = list; s.favs = favs; mockSave(s); return Promise.resolve({ ok: true, favs: list });
    }
    if (b.action === 'upload') {
      const m = Object.assign({}, b.material, { id: 'u' + Date.now(), by: tc.name, date: new Date().toISOString().slice(0, 10) });
      if (b.file) m.url = 'https://example.org/oneshot-file/' + encodeURIComponent(b.file.name);   // 시험 모드: 드라이브 대신 견본 주소
      s.uploads.push(m); mockSave(s); return Promise.resolve({ ok: true, id: m.id });
    }
    if (b.action === 'hide') {
      const all = [...SAMPLE.materials, ...s.uploads]; const m = all.find(x => String(x.id) === String(b.id));
      if (m && m.by && m.by !== tc.name) return Promise.resolve({ ok: false, error: 'not_owner' });
      s.hidden.push(String(b.id)); mockSave(s); return Promise.resolve({ ok: true });
    }
    return Promise.resolve({ ok: false, error: 'unknown' });
  }

  // ---------- 교사 로그인 상태(교사 기기에만 저장) ----------
  function loadTeacher() { try { return JSON.parse(localStorage.getItem('oneshot.teacher') || 'null'); } catch (e) { return null; } }
  function saveTeacher(x) { try { x ? localStorage.setItem('oneshot.teacher', JSON.stringify(x)) : localStorage.removeItem('oneshot.teacher'); } catch (e) {} }

  // ---------- 작은 조각 ----------
  function topicHref(name, level) { return '#/t/' + encodeURIComponent(name) + (level ? '/' + encodeURIComponent(level) : ''); }
  function fullUrl(hash) { return location.href.split('#')[0] + hash; }
  function topicLabel(tp) { return lang === 'fr' && tp.fr ? { big: tp.fr, small: tp.name } : { big: tp.name, small: tp.fr }; }
  function topicIcon(tp) {
    if (tp.icon) return { v: tp.icon, txt: !/\p{Extended_Pictographic}/u.test(tp.icon) };
    for (const [re, v] of TOPIC_ICONS) if (re.test(tp.name)) return v.indexOf('txt:') === 0 ? { v: v.slice(4), txt: true } : { v, txt: false };
    return { v: tp.name.replace(/\s/g, '').slice(0, 1), txt: true };
  }
  function langToggle(small) {
    return `<div class="lang${small ? ' sm' : ''}"><button type="button" data-lang="ko" class="${lang === 'ko' ? 'on' : ''}">${small ? '한' : '한국어'}</button><button type="button" data-lang="fr" class="${lang === 'fr' ? 'on' : ''}">FR</button></div>`;
  }
  function appTitle() { return data.settings.title || CFG.TITLE || '한글원샷'; }
  // 자료실 위: 첫 화면 QR 단추(QR 탭을 없애며 옮김, 2026-10-24)
  function barHome() { return `<header class="appbar"><a class="brand" href="#/"><img class="hlogo" src="icons/logo-h.svg" alt="${esc(appTitle())}"></a><span class="hbtns">${langToggle(true)}<a class="circ" href="#/qr" aria-label="${esc(t('homeQrBtn'))}">${ICON.qr}</a></span></header>`; }
  const isFav = id => !!(teacher && (teacher.favs || []).includes(id));
  const starBtn = m => { const on = isFav(m.id); return `<button type="button" class="star${on ? ' on' : ''}" data-fav="${esc(m.id)}" aria-pressed="${on}" aria-label="${esc(t(on ? 'favOff' : 'favOn'))}">${ICON.star}</button>`; };
  function barSub(title, backHref, right) {
    const left = backHref ? `<a class="circ" href="${backHref}" aria-label="${esc(t('back'))}">${ICON.back}</a>` : '<span class="circ ghost"></span>';
    return `<header class="appbar">${left}<b class="atitle">${esc(title)}</b>${right || langToggle(true)}</header>`;
  }
  function matInner(m, withTopic) {
    const [emo, bg] = TYPE_ICON[m.type] || TYPE_ICON['기타'];
    const meta = [withTopic ? `${m.topic} · ${m.level}` : '', m.type, m.minutes ? m.minutes + t('min') : '', withTopic ? '' : m.school].filter(Boolean).join(' · ');
    return `<span class="ti" style="background:${bg}">${emo}</span><span class="tx"><span class="tt">${esc(m.title)}</span><span class="meta">${esc(meta)}</span>${m.desc ? `<span class="ds">${esc(m.desc)}</span>` : ''}</span>`;
  }
  const goBtn = m => `<span class="go k-${esc(m.level)}">${ICON.out}</span>`;

  // 소속 학교 선택지(config.js SCHOOLS). 값은 한국어 이름, 보이는 글은 언어에 따라. 이름에 도시가 없으면 도시를 붙인다.
  function schoolOptions(cur) {
    const fr = lang === 'fr';
    const label = s => { const n = fr ? s.fr : s.ko, c = fr ? s.cityFr : s.city; return c && n.indexOf(c) < 0 ? `${n} (${c})` : n; };
    const key = s => fr ? `${s.cityFr} ${s.fr}` : s.ko;
    const list = SCHOOLS.slice().sort((a, b) => key(a).localeCompare(key(b), fr ? 'fr' : 'ko'));
    if (cur && !list.some(s => s.ko === cur)) list.unshift({ ko: cur, fr: cur });   // 시트에 목록 밖 학교가 적혀 있으면 그대로 둔다
    return `<option value="">${esc(t('phSchool'))}</option>` + list.map(s => `<option value="${esc(s.ko)}"${s.ko === cur ? ' selected' : ''}>${esc(label(s))}</option>`).join('');
  }

  // 링크 알아보기: 자료 형식은 '링크 하나'로 통일한다. 학습자가 못 여는 링크는 막고, 고칠 점은 미리 알려 준다.
  function linkCheck(u) {
    u = String(u || '').trim();
    if (!u) return { lv: '', msg: t('lkAny') };
    let x; try { x = new URL(u); } catch (e) { return { lv: 'bad', msg: t('lkBad') }; }
    if (!/^https?:$/.test(x.protocol)) return { lv: 'bad', msg: t('lkBad') };
    const h = x.hostname.replace(/^www\./, ''), p = x.pathname;
    if (/^(localhost|127\.|10\.|192\.168\.|0\.0\.0\.0)/.test(h) || /\.local$/.test(h)) return { lv: 'bad', msg: t('lkLocal') };
    let r;
    if (h === 'drive.google.com') r = /\/(folders|my-drive)\b/.test(p) ? { lv: 'warn', msg: t('lkFolder') } : { lv: 'ok', msg: t('lkDrive') };
    else if (h === 'docs.google.com') r = /^\/forms\//.test(p) ? { lv: 'ok', msg: t('lkForm') } : /\/copy\b/.test(p) ? { lv: 'warn', msg: t('lkCopy') } : { lv: 'ok', msg: t('lkDocs') };
    else if (/(^|\.)youtube\.com$/.test(h) || h === 'youtu.be') r = { lv: 'ok', msg: t('lkYoutube') };
    else r = { lv: 'ok', msg: t('lkSite') };
    if (x.protocol === 'http:' && r.lv === 'ok') r = { lv: 'warn', msg: t('lkHttp') };
    return r;
  }
  function linkHint(r) { return `<span class="m">${{ ok: '✓', warn: '!', bad: '×' }[r.lv] || 'i'}</span><span>${esc(r.msg)}</span>`; }

  // 홈 화면에 추가(주소창 없이 앱처럼). 안드로이드 크롬은 '추가' 단추, 아이폰은 공유 버튼 안내. 이미 앱으로 열었거나 PC면 보이지 않는다.
  const IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  function installCard() {
    if (installHide || isStandalone() || !window.matchMedia('(pointer: coarse)').matches || !(installEvt || IOS)) return '';
    const sub = installEvt ? esc(t('installSub')) : t('installIos')(ICON.share);
    return `<div class="install noprint"><span class="logo sym"><img src="icons/symbol.svg" alt=""></span><div class="tx"><b>${esc(t('installTitle'))}</b><small>${sub}</small></div>
      ${installEvt ? `<button type="button" class="inbtn" data-install>${esc(t('installBtn'))}</button>` : ''}<button type="button" class="inx" data-install-x aria-label="${esc(t('close'))}">${ICON.x}</button></div>`;
  }

  // ---------- 화면 ----------
  function viewHome() {
    const groups = data.groups;
    const sel = groups.some(g => g.name === groupFilter) ? groupFilter : '';
    const shown = sel ? groups.filter(g => g.name === sel) : groups;
    const hero = `<section class="hero"><p class="hi">${esc(t('hi'))}</p><h1>${t('hero')}</h1><p class="other">${esc(t('heroOther'))}</p><div class="mascot">🐯</div></section>`;
    const notice = data.settings.notice ? `<div class="notice"><span class="e">📢</span><span>${esc(data.settings.notice)}</span></div>` : '';
    const chips = groups.length > 1 ? `<div class="chips">${[{ name: '' }].concat(groups).map(g => `<button type="button" class="chip${g.name === sel ? ' on' : ''}" data-group="${esc(g.name)}">${esc(g.name || t('all'))}</button>`).join('')}</div>` : '';
    const search = data.materials.length ? `<label class="srch lib">${ICON.search}<input id="libQ" type="search" enterkeyhint="search" placeholder="${esc(t('libSearch'))}" value="${esc(libQ)}" aria-label="${esc(t('libSearch'))}">`
      + `<button type="button" class="sx" data-libqx aria-label="${esc(t('clearQ'))}"${libQ ? '' : ' hidden'}>✕</button></label>` : '';
    return barHome() + `<div class="pad">${hero}${notice}${installCard()}${search}${chips}<div id="libBody">${libBody(shown)}</div>${footLine()}</div>`;

  // ---------- 즐겨찾기(#/fav) ----------
  // 교사가 자료실에서 ☆로 담아 둔 자료. 필터(묶음·주제·레벨·유형) + 정렬. 카드마다 QR 단추(학생에게 보여 주기).
  // 글자 찾기는 자료실로 옮김(2026-10-25 휴먼쌤 "즐겨찾기 탭에 있는 검색창은 없애주고 대신 자료실에는 신규로 만들어줘").
  const FAV_KEYS = ['group', 'topic', 'level', 'type'];
  const favLab = k => t({ group: 'fGroup', topic: 'fTopic', level: 'fLevel', type: 'fType' }[k]);
  function groupOf(m) { const tp = data.topics.find(x => x.name === m.topic); return tp ? tp.group : m.group; }
  function favAll() { const by = new Map(data.materials.map(m => [m.id, m])); return ((teacher && teacher.favs) || []).map(id => by.get(id)).filter(Boolean); }
  function favVal(m, k) { return k === 'group' ? groupOf(m) : m[k]; }
  function favShown() {
    let list = favAll().filter(m => FAV_KEYS.every(k => !favF[k].length || favF[k].includes(favVal(m, k))));
    if (favSort === 'title') list = list.slice().sort((a, b) => a.title.localeCompare(b.title, 'ko'));
    if (favSort === 'topic') {
      const ord = new Map(data.topics.map((x, i) => [x.name, i]));
      list = list.slice().sort((a, b) => (ord.get(a.topic) - ord.get(b.topic)) || (LEVEL_KEYS.indexOf(a.level) - LEVEL_KEYS.indexOf(b.level)));
    }
    return list;
  }
  // 필터 칩에 쓸 값: 담은 자료에 실제로 있는 것만. 소주제는 고른 대주제가 있으면 그 안에서.
  function favChoices(all) {
    const uniq = a => [...new Set(a)];
    const topicOrder = data.topics.map(x => x.name), groupOrder = data.groups.map(g => g.name);
    const inG = m => !favF.group.length || favF.group.includes(groupOf(m));
    const byOrder = (vals, order) => vals.sort((a, b) => (order.indexOf(a) + 1 || 1e9) - (order.indexOf(b) + 1 || 1e9));
    return {
      group: byOrder(uniq(all.map(groupOf)), groupOrder),
      topic: byOrder(uniq(all.filter(inG).map(m => m.topic)), topicOrder),
      level: LEVEL_KEYS.filter(k => all.some(m => m.level === k)),
      type: byOrder(uniq(all.map(m => m.type)), TYPES)
    };
  }

    const fo = (k, v, lab, on, cls) => `<button type="button" class="fo${cls || ''}${on ? ' on' : ''}" data-fk="${k}" data-fv="${esc(v)}" aria-pressed="${on}">${esc(lab)}</button>`;

    const srt = ['added', 'title', 'topic'].map(s => `<button type="button" class="fo srt${favSort === s ? ' on' : ''}" data-fsort="${s}" aria-pressed="${favSort === s}">${esc(t({ added: 'sortAdded', title: 'sortTitle', topic: 'sortTopic' }[s]))}</button>`).join('');
    const tools = all.length ? `<div class="fpanel">${FAV_KEYS.map(row).join('')}${all.length > 1 ? `<div class="frow"><span class="fl">${esc(t('sortK'))}</span><div class="fopts">${srt}</div></div>` : ''}</div>`
        + `<div class="rhead"><b id="favFound">${esc(t('favFound')(shown.length))}</b>${nF ? `<button type="button" data-freset>${esc(t('reset'))}</button>` : ''}</div>` : '';
    return head + `<div class="pad">${tools}<div id="favList">${favListHtml(all, shown)}</div></div>`;
  }
  async function toggleFav(b) {

    const id = b.dataset.fav, on = !isFav(id), before = (teacher.favs || []).slice();

  // 아래 탭: 자료실 · 즐겨찾기 · 선생님(2026-10-24 휴먼쌤 "이 QR탭을 없애고 ... '홈' 탭은 '자료실' 탭으로 ... 'QR탭'을 '즐겨찾기'로")
  function renderTabs(page) {
    const tc = ['login', 'join', 'mine', 'upload'].includes(page);
    const on = { fav: page === 'fav', tc, lib: page !== 'fav' && !tc };
    $('#tabbar').innerHTML = `<a class="tab${on.lib ? ' on' : ''}" href="#/">${ICON.shelf}<span>${esc(t('tabHome'))}</span></a>
      <a class="tab${on.fav ? ' on' : ''}" href="#/fav">${ICON.star}<span>${esc(t('tabFav'))}</span></a>
      <a class="tab${on.tc ? ' on' : ''}" href="${teacher ? '#/mine' : '#/login'}">${ICON.person}<span>${esc(t('tabTeacher'))}</span></a>`;
  }

  // ---------- 길 찾기(해시) ----------
  function route() { return location.hash.replace(/^#\/?/, '').split('/').map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } }); }
  function render(keepScroll) {
    const parts = route(), page = parts[0] || '', v = $('#screen');
    document.documentElement.lang = lang;
    $('#app').classList.toggle('notab', page === 'upload' && !!teacher);
    $('#app').classList.toggle('dimtab', page === 'fav' && !teacher);   // 로그인 안내창 위로도 아래 탭은 누를 수 있게
    if (loadError) {
      v.innerHTML = barHome() + `<div class="pad"><div class="emptycard" style="margin-top:18px"><div class="e">😢</div>${esc(t('loadErr'))}<button type="button" class="btn" id="retry">${esc(t('retry'))}</button></div></div>`;
      $('#retry').onclick = boot; renderTabs(page, parts); return;
    }
    const fromQr = firstRender && page === 't';
    firstRender = false;
    if (page !== 'join') joined = null;  // 가입 결과 화면도 떠나면 잊는다(코드는 로그인 상태에 남아 있다)
    let title = appTitle();
    switch (page) {
      case 't': v.innerHTML = viewTopic(parts[1] || '', normLevel(parts[2]), fromQr); title = (parts[1] || '') + ' · ' + title; break;
      case 'qr': v.innerHTML = viewQr(parts[1] || ''); drawQrs(); title = 'QR · ' + title; break;
      case 'mq': v.innerHTML = viewMatQr(parts[1] || ''); drawQrs(); title = 'QR · ' + title; break;
      case 'fav': v.innerHTML = viewFav(); title = t('tabFav') + ' · ' + title; break;
      case 'login': v.innerHTML = teacher ? viewMine() : viewLogin(true); bindLogin(); break;
      case 'join': v.innerHTML = teacher && !joined ? viewMine() : viewJoin(); bindJoin(); title = t('joinTitle') + ' · ' + title; break;
      case 'mine': v.innerHTML = viewMine(); bindLogin(); break;
      case 'upload': v.innerHTML = viewUpload(parts[1] || '', normLevel(parts[2])); bindUpload(); bindLogin(); break;
      default: v.innerHTML = viewHome();
    }
    document.title = title;
    renderTabs(page, parts);
    if (!keepScroll) window.scrollTo(0, 0);
  }

  function bindLogin() {
    const f = $('#loginForm'); if (!f) return;
    f.onsubmit = async e => {
      e.preventDefault(); const code = f.elements.code.value.trim(); const err = $('#loginErr'); err.textContent = '';
      if (!code) { f.elements.code.focus(); return; }
      try {
        const r = await api.post({ action: 'login', code });
        if (r.ok) {
          teacher = { code, name: r.teacher.name, school: r.teacher.school, favs: Array.isArray(r.favs) ? r.favs : [] }; saveTeacher(teacher); toast(t('loggedIn'));
          const go = afterLogin || '#/mine'; afterLogin = '';
          if (location.hash === go) render(); else location.hash = go;
        } else err.textContent = r.error === 'too_many' ? t('tooMany') : t('badCode');
      } catch (ex) { err.textContent = t('netErr'); }
    };
  }
  function bindJoin() {
    const cp = $('[data-copycode]');
    if (cp) cp.onclick = async () => {
      try { await navigator.clipboard.writeText(joined.code); toast(t('codeCopied')); }
      catch (ex) { const r = document.createRange(), s = getSelection(); r.selectNodeContents($('#newCode')); s.removeAllRanges(); s.addRange(r); toast(t('copySel')); }
    };
    const f = $('#joinForm'); if (!f) return;
    const el = n => f.elements[n], sch = el('school');
    sch.onchange = () => sch.classList.toggle('empty', !sch.value);
    f.onsubmit = async e => {
      e.preventDefault(); const err = $('#joinErr'); err.textContent = '';
      const name = el('name').value.replace(/\s+/g, ' ').trim(), school = sch.value, joinCode = el('joinCode').value.trim();
      if (!name) { el('name').focus(); err.textContent = t('needName'); return; }
      if (SCHOOLS.length && !school) { sch.focus(); err.textContent = t('needSchool'); return; }
      if (!joinCode) { el('joinCode').focus(); err.textContent = t('needJoin'); return; }
      if (!el('agree').checked) { err.textContent = t('needAgree'); return; }
      const btn = $('#joinBtn'); btn.disabled = true; btn.textContent = t('joining');
      try {
        const r = await api.post({ action: 'join', joinCode, name, school, agree: true });
        if (r.ok) {
          teacher = { code: r.code, name: r.teacher.name, school: r.teacher.school }; saveTeacher(teacher);
          joined = { code: r.code, name: r.teacher.name, school: r.teacher.school }; render(); return;
        }
        err.textContent = { bad_join: t('badJoin'), join_closed: t('joinClosed'), dup_name: t('dupName'), too_many: t('tooMany'), missing: t('needName'), need_agree: t('needAgree') }[r.error] || t('netErr');
      } catch (ex) { err.textContent = t('netErr'); }
      btn.disabled = false; btn.textContent = t('joinBtn');
    };
  }
  // 고르기 목록(주제·묶음 칸): items = [{ v, label, sub, em, emTxt, bg, group }]. 적은 글자로 거르고, 딱 맞는 게 없으면 '새로 쓰기' 줄을 둔다.
  // 고르면 칸에 v를 넣고 change를 보내 폼이 다시 맞춘다(input을 보내면 목록이 다시 열려서).
  function bindCombo(box, items, newLabel) {
    const inp = box.querySelector('input'), list = box.querySelector('.cblist'), tog = box.querySelector('.tog');
    const norm = s => String(s || '').replace(/\s+/g, '').toLowerCase();
    let shown = [], at = -1, hasNew = false;
    const draw = () => {
      const q = norm(inp.value), exact = items.some(x => norm(x.v) === q);
      shown = q && !exact ? items.filter(x => norm(x.v + ' ' + x.label + ' ' + (x.sub || '')).includes(q)) : items;   // 딱 맞으면 다 보여 준다(다른 것으로 바꾸기 쉽게)
      hasNew = !!q && !exact;
      let html = '', g = null;
      shown.forEach((x, i) => {
        if (x.group && x.group !== g) { g = x.group; html += `<div class="gh">${esc(g)}</div>`; }
        html += `<button type="button" class="cbo${i === at ? ' on' : ''}${norm(x.v) === q ? ' cur' : ''}" data-i="${i}" role="option" aria-selected="${norm(x.v) === q}">`
          + (x.em != null ? `<span class="em${x.emTxt ? ' txt' : ''}" style="background:${x.bg || '#F6EEE4'}">${esc(x.em)}</span>` : '')
          + `<span>${esc(x.label)}</span>${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</button>`;
      });
      if (hasNew) html += `<button type="button" class="cbo new${at === shown.length ? ' on' : ''}" data-new="1" role="option"><span class="em">+</span><span>${esc(newLabel(inp.value.trim()))}</span></button>`;
      list.innerHTML = html || `<div class="cbempty">${esc(t('cbNone'))}</div>`;
    };
    const open = () => { at = -1; draw(); list.hidden = false; box.classList.add('open'); inp.setAttribute('aria-expanded', 'true'); };
    const close = () => { list.hidden = true; box.classList.remove('open'); inp.setAttribute('aria-expanded', 'false'); };
    const done = () => { close(); inp.dispatchEvent(new Event('change', { bubbles: true })); };
    inp.addEventListener('focus', open);
    inp.addEventListener('input', () => { if (list.hidden) open(); else { at = -1; draw(); } });
    inp.addEventListener('blur', () => setTimeout(close, 150));
    inp.addEventListener('keydown', e => {
      const n = shown.length + (hasNew ? 1 : 0);
      if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && n) {
        e.preventDefault(); if (list.hidden) open();
        const d = e.key === 'ArrowDown' ? 1 : -1;
        at = at < 0 ? (d > 0 ? 0 : n - 1) : (at + d + n) % n; draw();
        const on = list.querySelector('.cbo.on'); if (on) on.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter' && !list.hidden && at >= 0) {
        e.preventDefault(); if (at < shown.length) inp.value = shown[at].v; done();
      } else if (e.key === 'Escape') close();
    });
    // 목록을 눌러도 칸이 포커스를 잃지 않게(그래야 누르기 전에 목록이 닫히지 않는다). 손가락으로 끌어 내리는 것은 그대로 된다.
    list.addEventListener('pointerdown', e => e.preventDefault());
    list.addEventListener('click', e => {
      const b = e.target.closest('.cbo'); if (!b) return;
      if (!b.dataset.new) inp.value = shown[+b.dataset.i].v;
      done();
    });
    tog.addEventListener('pointerdown', e => e.preventDefault());
    tog.addEventListener('click', () => { if (list.hidden) { inp.focus(); open(); } else close(); });
  }
  function topicItems() {
    return data.groups.flatMap(g => g.topics.map(tp => { const L = topicLabel(tp), ic = topicIcon(tp); return { v: tp.name, label: L.big, sub: L.small, em: ic.v, emTxt: ic.txt, bg: tp.color, group: g.name }; }));
  }

  function bindUpload() {
    const f = $('#upForm'); if (!f) return;
    const el = n => f.elements[n];
    f.querySelectorAll('.cbx').forEach(box => box.dataset.cb === 'topic'
      ? bindCombo(box, topicItems(), s => t('cbNewTopic')(s))
      : bindCombo(box, data.groups.map(g => ({ v: g.name, label: g.name, sub: t('nTopics')(g.topics.length) })), s => t('cbNewGroup')(s)));
    const topicNames = data.topics.map(x => x.name);
    const syncGroup = () => { const v = el('topic').value.trim(); $('#groupField').hidden = !v || topicNames.includes(v); };
    const pv = () => {
      const m = normMaterial({ title: el('title').value || t('phTitle'), type: el('type').value, minutes: 0, school: el('school').value,
        desc: el('desc').value, url: '#', topic: 'x', level: el('level').value || LEVEL_KEYS[0] }, 0);
      $('#upPreview').innerHTML = `<div class="item">${matInner(m)}${goBtn(m)}</div>`;
    };
    const syncLink = () => { const r = linkCheck(el('url').value), h = $('#urlHint'); h.className = 'lhint' + (r.lv ? ' ' + r.lv : ''); h.innerHTML = linkHint(r); };
    const sync = () => { syncGroup(); syncLink(); el('school').classList.toggle('empty', !el('school').value); pv(); };
    // 파일 고르기: 크기·형식을 바로 알려 주고, 제목이 비어 있으면 파일 이름으로 채운다
    const fileOk = fl => !fl ? { lv: 'bad', msg: t('needFile') } : !fl.size ? { lv: 'bad', msg: t('fileReadErr') } : !FILE_EXT.includes(fileExt(fl.name)) ? { lv: 'bad', msg: t('fileBad') }
      : fl.size > FILE_MAX_MB * 1048576 ? { lv: 'bad', msg: t('fileBig')(FILE_MAX_MB) } : { lv: 'ok', msg: t('fileKeep') };
    const syncFile = () => {
      const fl = $('#f-file').files[0], r = fl ? fileOk(fl) : { lv: '', msg: t('fileKeep') }, h = $('#fileHint');
      $('#fileBox').classList.toggle('has', !!fl && r.lv === 'ok');
      $('#fileName').innerHTML = fl ? `${esc(fl.name)}<small>${(fl.size / 1048576).toFixed(1)}MB</small>` : `${esc(t('pickFile'))}<small>${esc(t('fileWhat')(FILE_MAX_MB))}</small>`;
      h.className = 'lhint' + (r.lv ? ' ' + r.lv : ''); h.innerHTML = linkHint(r);
      if (fl && r.lv === 'ok' && !el('title').value.trim()) { el('title').value = fl.name.replace(/\.[^.]+$/, '').slice(0, 60); pv(); }
    };
    $('#f-file').addEventListener('change', e => { e.stopPropagation(); syncFile(); });
    f.querySelectorAll('[data-src]').forEach(b => b.onclick = () => {
      upSrc = b.dataset.src;
      f.querySelectorAll('[data-src]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.src === upSrc)));
      $('#srcFile').hidden = upSrc !== 'file'; $('#srcLink').hidden = upSrc !== 'link';
    });
    const readB64 = fl => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => no(r.error); r.readAsDataURL(fl); });
    f.addEventListener('input', sync); f.addEventListener('change', sync); sync();
    const ps = f.querySelector('[data-paste]');
    if (ps) ps.onclick = async () => { try { const s = (await navigator.clipboard.readText()).trim(); if (s) { el('url').value = s; sync(); } else el('url').focus(); } catch (ex) { el('url').focus(); } };
    f.onsubmit = async e => {
      e.preventDefault(); const err = $('#upErr'); err.textContent = '';
      const topic = el('topic').value.trim(); const known = data.topics.find(x => x.name === topic);
      const material = { group: known ? known.group : (el('group').value.trim() || '기타'), topic, level: el('level').value || '', title: el('title').value.trim(),
        type: el('type').value, url: upSrc === 'link' ? el('url').value.trim() : '', desc: el('desc').value.trim(), minutes: 0, school: el('school').value.trim() };
      const fail = msg => { err.textContent = msg; toast(msg); };
      if (SCHOOLS.length && !material.school) { el('school').focus(); return fail(t('needSchool')); }
      const fl = upSrc === 'file' ? $('#f-file').files[0] : null;
      if (upSrc === 'file') { const fr = fileOk(fl); if (fr.lv === 'bad') return fail(fr.msg); }
      if (!material.title || !material.topic || !material.level || (upSrc === 'link' && !material.url)) return fail(t('required'));
      if (upSrc === 'link') { const lk = linkCheck(material.url); if (lk.lv === 'bad') { el('url').focus(); return fail(lk.msg); } }
      const btn = $('#upBtn'); btn.disabled = true; btn.textContent = t('uploading');
      try {
        let file = null;
        if (fl) { try { file = { name: fl.name, type: fl.type || '', size: fl.size, data: await readB64(fl) }; } catch (ex) { btn.disabled = false; btn.textContent = t('submit'); return fail(t('fileReadErr')); } }
        const r = await api.post({ action: 'upload', code: teacher.code, material, file });
        if (r.ok) {
          if (material.school !== teacher.school) { teacher.school = material.school; saveTeacher(teacher); }   // 다음에 올릴 때 이 학교가 먼저 골라져 있다
          await reload(); toast(t('uploaded')); location.hash = topicHref(material.topic, material.level);
        }
        else if (r.error === 'bad_code') { teacher = null; saveTeacher(null); location.hash = '#/login'; }
        else fail({ file_big: t('fileBig')(FILE_MAX_MB), file_type: t('fileBad'), file_empty: t('fileReadErr'), file_save: t('netErr'), missing: t('required') }[r.error] || r.error || t('netErr'));
      } catch (ex) { fail(t('netErr')); }
      btn.disabled = false; btn.textContent = t('submit');
    };
  }
  async function hideMat(b) {
    b.disabled = true;
    try {
      const r = await api.post({ action: 'hide', code: teacher.code, id: b.dataset.hide });
      if (r.ok) { await reload(); toast(t('hidden')); render(true); }
      else toast(r.error === 'not_owner' ? t('notOwner') : t('netErr'));
    } catch (ex) { toast(t('netErr')); }
    b.disabled = false;
  }

  // 누르기는 한곳에서 받는다
  document.addEventListener('click', e => {
    const L = e.target.closest('[data-lang]'); if (L) { lang = L.dataset.lang; render(true); return; }
    const G = e.target.closest('[data-group]'); if (G) { groupFilter = G.dataset.group; render(true); return; }
    const V = e.target.closest('[data-level]'); if (V) { const p = route(); history.replaceState(null, '', topicHref(p[1] || '', V.dataset.level)); render(true); return; }
    if (e.target.closest('[data-print]')) { window.print(); return; }
    if (e.target.closest('[data-install]')) { const ev = installEvt; if (ev) { ev.prompt(); Promise.resolve(ev.userChoice).catch(() => {}).then(() => { installEvt = null; render(true); }); } return; }
    if (e.target.closest('[data-install-x]')) { installHide = true; render(true); return; }
    if (e.target.closest('[data-logout]')) { teacher = null; saveTeacher(null); toast(t('logout')); if (location.hash === '#/') render(); else location.hash = '#/'; return; }
    const H = e.target.closest('[data-hide]'); if (H) { e.preventDefault(); hideMat(H); return; }
    // 즐겨찾기: ☆ 담기·빼기, 필터(줄마다 하나, 다시 누르거나 '전체'면 풀림)·정렬 고르기, 초기화 / 자료실 찾는 글자 지우기 / 로그인 안내 → 로그인 뒤 즐겨찾기로
    const FV = e.target.closest('[data-fav]'); if (FV) { e.preventDefault(); toggleFav(FV); return; }
    const FK = e.target.closest('[data-fk]'); if (FK) {
      const k = FK.dataset.fk, v = FK.dataset.fv;
      favF[k] = !v || (favF[k].length === 1 && favF[k][0] === v) ? [] : [v];
      if (k === 'group' && favF.group.length) favF.topic = favF.topic.filter(tn => { const tp = data.topics.find(x => x.name === tn); return tp && favF.group.includes(tp.group); });
      render(true); return;
    }
    const FS = e.target.closest('[data-fsort]'); if (FS) { favSort = FS.dataset.fsort; render(true); return; }
    if (e.target.closest('[data-freset]')) { favF = { group: [], topic: [], level: [], type: [] }; favSort = 'added'; render(true); return; }
    if (e.target.closest('[data-libqx]')) { libQ = ''; const i = $('#libQ'); if (i) { i.value = ''; i.focus(); } drawLib(); return; }
    if (e.target.closest('[data-tofav]')) afterLogin = '#/fav';
  });
  document.addEventListener('input', e => { if (e.target && e.target.id === 'libQ') { libQ = e.target.value; drawLib(); } });

  let toastTimer;
  function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1900); }

  async function reload() { const raw = await api.load(); if (!raw || raw.ok === false) throw new Error(raw && raw.error || 'load'); prepare(raw); }
  async function boot() {
    loadError = false; $('#screen').innerHTML = `<div class="loading"><span class="e">🐯</span>${esc(t('loading'))}</div>`;
    try { await reload(); } catch (e) { loadError = true; }
    render();
    refreshTeacher();
  }
  // 로그인해 둔 기기: 즐겨찾기를 서버에서 다시 받아 맞춘다(다른 기기에서 담은 것도 보이게). 코드가 없어졌으면 로그아웃.
  async function refreshTeacher() {
    if (!teacher) return;
    try {
      const r = await api.post({ action: 'login', code: teacher.code });
      if (!teacher) return;
      if (r.ok) {
        teacher = Object.assign({}, teacher, { name: r.teacher.name, school: r.teacher.school, favs: Array.isArray(r.favs) ? r.favs : (teacher.favs || []) });
        saveTeacher(teacher);
        if (['t', 'fav', 'mine'].includes(route()[0] || '')) render(true);
      } else if (r.error === 'bad_code') { teacher = null; saveTeacher(null); render(true); }
    } catch (e) {}
  }
  window.addEventListener('hashchange', () => render());
  // 홈 화면에 추가: 크롬이 설치 기회를 주면 첫 화면 안내에 '추가' 단추를 단다. 서비스 워커는 앱처럼 열리게 하는 최소한의 것(sw.js).
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if ($('.hero')) render(true); });
  window.addEventListener('appinstalled', () => { installEvt = null; if ($('.hero')) render(true); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  boot();
})();
</script>
</body>
</html>
